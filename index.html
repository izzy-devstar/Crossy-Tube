    .catch(e => e && e.code === 'unavailable' ? new Promise(r => setTimeout(r, 1500 + Math.random() * 1000)).then(attempt) : Promise.reject(e))
    .then(() => { if (LB.name === name) LB.mine = doc; LB.err = ''; lbRender(); })
    .catch(e => {
      if (run) LB.pending = LB.pending && LB.pending.dist + LB.pending.bonus >= run.dist + run.bonus ? LB.pending : run;
      if (e && e.code === 'permission-denied') { LB.needPin = true; LB.askName = true; LB.err = ''; }   // name isn't this computer's (yet)

// the row this player should have after these runs (null when nothing changed). A run counts for this week only

function lbMerge(runs) {

  delete d.id;
  let changed = d.name !== LB.name;
  d.name = LB.name;
  if (d.week !== wk) { d.week = wk; d.wBest = 0; delete d.wRun; d.wAt = 0; }
  for (const [r, thisWeek, at] of runs) {
    if (!r || !runOk(r)) continue;
    const s = r.dist + r.bonus;
    if (!(d.best > 0) || s > d.best) { d.best = s; d.run = r; d.at = at || now; changed = true; }
    if (thisWeek && s > d.wBest) { d.wBest = s; d.wRun = r; d.wAt = at || now; changed = true; }

  LB.pending = null;

  const s = r.dist + r.bonus;

  if (LB.last.ranked) {
    if (!runOk(r)) { LB.last.ranked = false; LB.last.failed = true; }     // should never happen in honest play
    else {
      LB.last.newBest = !LB.mine || !rowOk(LB.mine) || s > LB.mine.best;
      LB.last.wkBest = LB.last.newBest || !weekOk(LB.mine, weekKey()) || s > LB.mine.wBest;
      if (LB.last.wkBest && !LB.last.newBest) LB.tab = 'week';           // show the board the news is about

      if (LB.state === 'loading' || LB.state === 'ok') {

  try { await LB.db.doc('names/' + name).set({ owner: LB.uid, pin: h }); return 'ok'; }

}
async function lbSaveName(rawName, rawPin) {
  const n = String(rawName || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);

  const pin = String(rawPin || '');

    if (muted) return { ok: false, text: 'Sound is muted. Press M or the speaker button.' };

    src.start(at, Math.random() * 0.5); src.stop(at + dur + 0.05);
  }
  const jit = (x, k = 0.06) => x * (1 + (Math.random() * 2 - 1) * k);   // a little variety so repeats don't grate

  // ----- the sounds -----
  const S = {
    hop()  { if (!gate('hop', 0.03)) return; tone(jit(430), 0.07, { type: 'triangle', to: jit(720), vol: 0.22 }); },
    bump() { if (!gate('bump', 0.1)) return; tone(150, 0.09, { to: 90, vol: 0.3 }); noise(0.05, { f: 600, vol: 0.12 }); },
    coin() {
      if (!gate('coin', 0.04)) return;
      tone(1319, 0.07, { type: 'square', vol: 0.08 });
      tone(1976, 0.22, { type: 'square', vol: 0.08, delay: 0.06 });
    },
    log()  { if (!gate('log', 0.05)) return; tone(jit(260), 0.08, { to: 180, vol: 0.25 }); noise(0.05, { type: 'bandpass', f: 900, q: 3, vol: 0.18 }); },
    lapTick() { if (!gate('lapTick', 0.05)) return; tone(880, 0.08, { type: 'triangle', vol: 0.15 }); },
    bonus(big) {
      if (!gate('bonus', 0.15)) return;
      const notes = big ? [784, 988, 1175, 1568, 1976] : [1047, 1319, 1568];
      notes.forEach((f, i) => tone(f, 0.12, { type: 'square', vol: 0.07, delay: i * 0.065 }));
    },
    // the crossing bell; quieter the further the tracks are from you
    bell(vol) { if (!gate('bell', 0.07)) return; tone(1568, 0.28, { vol: 0.14 * vol }); tone(2350, 0.2, { vol: 0.06 * vol }); },
    horn(vol, red) {
      if (!gate('horn', 0.3)) return;
      const base = red ? 233 : 311;
      for (const f of [base, base * 1.26, base * 1.5]) tone(f, 0.7, { type: 'sawtooth', vol: 0.06 * vol, lp: 1400, a: 0.03 });
    },
    fuse()    { if (!gate('fuse', 0.06)) return; noise(0.08, { type: 'highpass', f: 2500, vol: 0.08 }); },
    crumble() { if (!gate('crumble', 0.08)) return; noise(0.45, { f: 900, to: 150, vol: 0.3 }); tone(110, 0.3, { to: 50, vol: 0.2 }); },
    // a falling whistle that lasts as long as the fall
    whistle(dur) { if (!gate('whistle', 0.2)) return; tone(1700, Math.max(0.2, dur), { to: 500, vol: 0.07, a: 0.08 }); },
    boom(size) {
      if (!gate('boom', 0.05)) return;
      const k = Math.min(1, 0.45 + size * 0.25);
      tone(95, 0.7, { to: 32, vol: 0.5 * k });
      noise(0.6, { f: 1200, to: 120, vol: 0.4 * k });
    },
    handComing(dur) {
      S.handStop();
      if (!gate('handComing', 0.2) || dur < 0.15) return;
      const at = ac.currentTime;
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const flt = ac.createBiquadFilter(); flt.type = 'bandpass'; flt.Q.value = 2;
      flt.frequency.setValueAtTime(300, at); flt.frequency.exponentialRampToValueAtTime(2200, at + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(0.22, at + dur);
      src.connect(flt); flt.connect(g); g.connect(out); src.start(at);
      loops.hand = { src, g };
    },
    handStop() {
      const l = loops.hand; if (!l || !ac) return;
      loops.hand = null;
      const at = ac.currentTime;
      l.g.gain.cancelScheduledValues(at); l.g.gain.setValueAtTime(Math.max(0.0001, l.g.gain.value), at);
      l.g.gain.exponentialRampToValueAtTime(0.0001, at + 0.12);
      l.src.stop(at + 0.15);
    },
    rattle() {
      if (!gate('rattle', 0.25)) return;
      for (let i = 0; i < 6; i++) noise(0.03, { type: 'bandpass', f: jit(3200, 0.2), q: 6, vol: 0.2, delay: i * 0.055 });
    },
    ghost() { if (!gate('ghost', 1)) return; tone(330, 1.4, { to: 520, vol: 0.12, vib: [6, 18], a: 0.25, lp: 1500 }); tone(247, 1.4, { to: 392, vol: 0.06, vib: [5, 12], a: 0.3 }); },
    // a car or truck honking at you; trucks are lower and longer
    honk(truck, vol = 1) {
      if (!gate('honk', 0.25)) return;
      if (truck) for (const f of [196, 247]) tone(f, 0.45, { type: 'square', vol: 0.06 * vol, lp: 1500, a: 0.02 });
      else for (const d of [0, 0.15]) for (const f of [440, 554]) tone(f, 0.11, { type: 'square', vol: 0.055 * vol, lp: 2200, delay: d });
    },
    // graveyard tunes: a wobbly organ in D minor over a low drone
    // graveyard tunes: a church bell, wind, a wailing ghost voice that slides between notes, and a low
    // drone on a tritone (the "devil's interval"), all in a big echoey room
    graveTune(leaving, wait = 0) {
      if (!gate(leaving ? 'graveOut' : 'graveIn', 2)) return;
      const at0 = ac.currentTime + wait;
      // a deep bell: out-of-tune partials that ring for a long time
      const bell = (f, t, vol) => {
        [[0.5, 1, 3.2], [1, 0.8, 2.6], [1.19, 0.5, 2], [1.5, 0.35, 1.6], [2, 0.3, 1.3], [2.74, 0.2, 1], [3.76, 0.12, 0.7]]
          .forEach(([r, v, d]) => tone(f * r, d, { vol: vol * v, delay: wait + t, a: 0.004, wet: 0.6 }));
      };
      // the ghost voice: one sine that glides from note to note with a wide, slow wobble
      const wail = (notes, vol) => {
        const osc = ac.createOscillator(); osc.type = 'sine';
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = 5.2; lg.gain.value = notes[0][0] * 0.025; lfo.connect(lg); lg.connect(osc.frequency);
        osc.frequency.setValueAtTime(notes[0][0], at0 + notes[0][1]);
        for (const [f, t] of notes.slice(1)) osc.frequency.setTargetAtTime(f, at0 + t, 0.09);
        const end = notes[notes.length - 1][1] + 0.9, start = notes[0][1];
        const g = ac.createGain();
        g.gain.setValueAtTime(0.0001, at0 + start);
        g.gain.exponentialRampToValueAtTime(vol, at0 + start + 0.45);
        g.gain.setValueAtTime(vol, at0 + end - 0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, at0 + end);
        osc.connect(g); g.connect(out);
        if (verb) { const w = ac.createGain(); w.gain.value = 0.7; g.connect(w); w.connect(verb); }
        osc.start(at0 + start); lfo.start(at0 + start); osc.stop(at0 + end + 0.05); lfo.stop(at0 + end + 0.05);
      };
      const wind = (d, vol) => noise(d, { type: 'bandpass', f: 380, to: 900, q: 4, vol, delay: wait, a: d * 0.4, wet: 0.4, rate: 0.6 });
      if (!leaving) {
        bell(147, 0, 0.16);
        bell(147, 1.7, 0.1);
        wind(4.2, 0.07);
        tone(73.4, 4.2, { type: 'sawtooth', vol: 0.05, lp: 280, a: 1.2, delay: wait, wet: 0.3 });     // D2
        tone(103.8, 4.2, { type: 'sawtooth', vol: 0.035, lp: 280, a: 1.6, delay: wait + 0.4, wet: 0.3 }); // G#2: the tritone
        // D5 ... slides down to Bb, A, falls to the tritone G#, sighs back up to A, sinks to D
        wail([[587, 0.35], [466, 1.0], [440, 1.5], [415, 2.1], [440, 2.6], [294, 3.2]], 0.075);
      } else {
        bell(220, 0, 0.1);
        wind(2.6, 0.05);
        tone(73.4, 2.6, { type: 'sawtooth', vol: 0.035, lp: 280, a: 0.5, delay: wait, wet: 0.3 });
        // a rising sigh that never resolves: A4 up to D5, then slips to C#5 and fades
        wail([[440, 0.2], [587, 0.7], [554, 1.3]], 0.065);
      }
    },
    rollerHorn() { if (!gate('rollerHorn', 1)) return; for (const d of [0, 0.22]) tone(392, 0.16, { type: 'square', vol: 0.07, delay: d, lp: 1800 }); },
    // steamroller engine: a low chug whose volume follows how close the nearest roller is (0..1)
    engine(level) {
      if (!ready()) return;
      if (!loops.engine && level > 0.01) {
        const osc = ac.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 52;
        const flt = ac.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 260;
        const chug = ac.createGain(); chug.gain.value = 0.6;
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = 9; lg.gain.value = 0.4; lfo.connect(lg); lg.connect(chug.gain);
        const g = ac.createGain(); g.gain.value = 0;
        osc.connect(flt); flt.connect(chug); chug.connect(g); g.connect(out);
        osc.start(); lfo.start();
        loops.engine = { osc, lfo, g };
      }
      const l = loops.engine; if (!l) return;
      l.g.gain.setTargetAtTime(0.35 * level, ac.currentTime, 0.15);
      if (level <= 0.01 && l.g.gain.value < 0.005) { l.osc.stop(); l.lfo.stop(); loops.engine = null; }
    },
    // darkness: a soft low pulse on each flash, so you can feel the beat
    pulse(vol) { if (!gate('pulse', 0.5)) return; tone(70, 0.35, { to: 45, vol: 0.4 * vol }); },
    death(cause) {
      if (!gate('death', 0.25)) return;
      const splash = () => { noise(0.5, { f: 3500, to: 300, vol: 0.35 }); tone(700, 0.25, { to: 180, vol: 0.12, delay: 0.05 }); };
      switch (cause) {
        case 'car':
          noise(0.18, { f: 1800, to: 300, vol: 0.45 }); tone(180, 0.2, { to: 60, vol: 0.4 });
          for (const f of [370, 466]) tone(f, 0.28, { type: 'square', vol: 0.05, delay: 0.12, lp: 2000 });   // honk
          break;
        case 'train':
          noise(0.5, { f: 2500, to: 200, vol: 0.5 }); tone(120, 0.4, { to: 40, vol: 0.45 });
          for (const f of [311, 392, 466]) tone(f, 0.8, { type: 'sawtooth', vol: 0.05, lp: 1400, delay: 0.05 });
          break;
        case 'water': splash(); break;
        case 'crack': noise(0.07, { type: 'bandpass', f: 1800, q: 2, vol: 0.4 }); tone(320, 0.08, { to: 140, vol: 0.25 }); splash(); break;
        case 'sink':
          splash();
          for (let i = 0; i < 4; i++) tone(jit(500, 0.2), 0.09, { to: 220, vol: 0.12, delay: 0.15 + i * 0.12 });   // glug
          break;
        case 'crumble': tone(500, 0.9, { to: 90, vol: 0.18, type: 'triangle' }); noise(0.5, { f: 700, to: 120, vol: 0.25 }); break;
        case 'boulder': case 'roller':
          noise(0.35, { f: 1500, to: 150, vol: 0.45 }); tone(140, 0.35, { to: 45, vol: 0.45 });
          tone(900, 0.25, { to: 1400, type: 'triangle', vol: 0.08, delay: 0.12 });   // squeak as you flatten
          break;
        case 'slap': noise(0.09, { type: 'highpass', f: 1400, vol: 0.55 }); tone(260, 0.1, { to: 120, vol: 0.3 }); break;
        case 'grab': noise(0.35, { type: 'bandpass', f: 600, to: 2400, q: 1.5, vol: 0.3 }); tone(300, 0.4, { to: 1100, type: 'triangle', vol: 0.12 }); break;
        case 'skeleton': for (let i = 0; i < 4; i++) noise(0.04, { type: 'bandpass', f: 2600, q: 5, vol: 0.35, delay: i * 0.04 }); tone(200, 0.15, { to: 80, vol: 0.3 }); break;
        case 'ghost': tone(520, 1.0, { to: 160, vol: 0.14, vib: [7, 25], a: 0.03, lp: 1600 }); noise(0.4, { type: 'bandpass', f: 800, to: 300, q: 2, vol: 0.15 }); break;
        default: noise(0.2, { f: 1500, to: 200, vol: 0.4 }); tone(160, 0.2, { to: 60, vol: 0.35 });
      }
    },
    gameOver() { if (!gate('gameOver', 1)) return; [523, 440, 349].forEach((f, i) => tone(f, 0.18, { type: 'triangle', vol: 0.12, delay: 0.05 + i * 0.13 })); },
    stopLoops() { S.handStop(); if (loops.engine && ac) loops.engine.g.gain.setTargetAtTime(0, ac.currentTime, 0.05); },
    unlock, status,
    get running() { return !!ac && ac.state === 'running'; },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('crossyrd2-muted', muted ? '1' : '0'); } catch (e) {}
      if (out) out.gain.setTargetAtTime(muted ? 0 : 0.5, ac.currentTime, 0.02);
      return muted;
    },
    get muted() { return muted; },
    played
  };
  return S;
})();

// ---------------- input ----------------
const KEYS = {
  ArrowUp: [0, 1], KeyW: [0, 1], ArrowDown: [0, -1], KeyS: [0, -1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0]
};
// test mode panel
const testPanel = document.getElementById('testPanel');
const testChoice = { only: 'park', speed: '0', god: '0' };
function syncTestPanel() {
  for (const grp of testPanel.querySelectorAll('.opts')) {
    for (const b of grp.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === testChoice[grp.dataset.group]));
  }
}
function openTestPanel() {
  if (test.on) Object.assign(testChoice, { only: test.only, speed: String(test.speedRow), god: test.god ? '1' : '0' });
  syncTestPanel();
  document.getElementById('testExit').style.display = test.on ? '' : 'none';
  testPanel.classList.add('open');
  elMini.style.display = 'none';
  document.getElementById('testStart').focus();
}
function closeTestPanel() { testPanel.classList.remove('open'); if (typeof lbShow === 'function' && LB.view === 'title') lbShow('title'); }
const testPanelOpen = () => testPanel.classList.contains('open');
testPanel.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) { if (e.target === testPanel) closeTestPanel(); return; }
  const grp = b.closest('.opts');
  if (grp) { testChoice[grp.dataset.group] = b.dataset.v; syncTestPanel(); return; }
  if (b.id === 'testStart') {
    Object.assign(test, { on: true, only: testChoice.only, speedRow: +testChoice.speed, god: testChoice.god === '1' });
    closeTestPanel(); reset();
  } else if (b.id === 'testExit') {
    test.on = false; closeTestPanel(); reset();
  }
});
document.getElementById('testBtn').addEventListener('click', openTestPanel);
const inTestUI = e => e.target && e.target.closest && e.target.closest('#testPanel, #testBtn, #muteBtn');

const muteBtn = document.getElementById('muteBtn');
// speaker: on, muted, or a quiet speaker while the browser hasn't let sound start yet
function syncMute() {
  const icon = SFX.muted ? '\u{1F507}' : SFX.running ? '\u{1F50A}' : '\u{1F508}';
  if (muteBtn.textContent !== icon) { muteBtn.textContent = icon; muteBtn.setAttribute('aria-pressed', String(SFX.muted)); }
}
syncMute();
muteBtn.addEventListener('click', () => { SFX.unlock(); SFX.toggleMute(); syncMute(); muteBtn.blur(); });
// open the sound on any first touch, click or key, wherever it lands
if (document.addEventListener) for (const ev of ['pointerdown', 'touchend', 'mousedown', 'click', 'keydown'])
  document.addEventListener(ev, () => SFX.unlock(), { capture: true, passive: true });
window.addEventListener('keydown', e => {
  SFX.unlock();
  if (e.code === 'KeyM' && !e.repeat && !(e.target && e.target.tagName === 'INPUT')) { SFX.toggleMute(); syncMute(); return; }
  if (e.target && e.target.tagName === 'INPUT') return;          // typing a leaderboard name
  if (LB.view === 'modal') { if (e.code === 'Escape' || e.code === 'KeyL') lbShow('title'); return; }
  if (testPanelOpen()) { if (e.code === 'Escape' || e.code === 'KeyT') closeTestPanel(); return; }
  if (e.code === 'KeyT' && (game.mode === 'ready' || game.mode === 'over')) { openTestPanel(); return; }
  if (game.mode === 'over') {
    if (!e.repeat && ['KeyR', 'Enter', 'Space'].includes(e.code)) reset();
    return;
  }
  const mv = KEYS[e.code];
  if (!mv) return;
  e.preventDefault();
  if (e.repeat) return;
  tryMove(mv[0], mv[1]);
});
let touch = null;
const inBoardUI = e => LB.view === 'modal' || (e.target && e.target.closest && e.target.closest('#boardCard, #lbMini'));
window.addEventListener('pointerdown', e => { SFX.unlock(); touch = inTestUI(e) || testPanelOpen() || inBoardUI(e) ? null : { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', e => {
  if (inTestUI(e) || testPanelOpen() || inBoardUI(e)) { touch = null; return; }
  if (game.mode === 'over') { reset(); return; }
  if (!touch) return;
  const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
  touch = null;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  if (Math.max(ax, ay) < 24) tryMove(0, 1);
  else if (ax > ay) tryMove(dx > 0 ? 1 : -1, 0);
  else tryMove(0, dy < 0 ? 1 : -1);
});

// ---------------- main loop ----------------
let last = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000;
  const dt = Math.min(0.05, now - last);
  last = now;
  update(dt);
  updateVisuals(dt);
  updateHUD();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

reset();
resize();
requestAnimationFrame(frame);
</script>
</body>
