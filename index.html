<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Crossy Rd²</title>
<meta name="description" content="Crossy Road in a tube. Hop, dodge, and climb the leaderboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    font-family: "Arial Black", "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  canvas { display: block; }
  /* the game always shows a 16:9 picture, the same view in any window; spare space becomes dark bars.
     The transform makes the HUD (position: fixed) sit inside this box instead of the whole window. */
  #game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; transform: translateZ(0); background: #000; }
  #game canvas { position: absolute; left: 0; top: 0; }
  .hud {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); color: #fff; pointer-events: none; font-weight: 900;
    text-shadow: 0 4px 0 #000, 3px 0 0 #000, -3px 0 0 #000, 0 -3px 0 #000;
  }
  #score { left: 24px; font-size: 64px; line-height: 1; }
  #best  { left: 26px; top: calc(86px + env(safe-area-inset-top, 0px)); font-size: 18px; }
  #coins { right: 26px; font-size: 40px; color: #ffd23f; }
  #center {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; text-align: center;
    pointer-events: none; text-shadow: 0 4px 0 #000, 3px 0 0 #000, -3px 0 0 #000;
  }
  #center.dim { background: rgba(0, 0, 0, .35); }
  #center h1 { font-size: 68px; margin: 0 0 14px; letter-spacing: 2px; }
  /* blocky 3D start title: white face, extruded sides built from stacked shadows */
  #center h1.logo {
    font-family: "Luckiest Guy", "Arial Black", sans-serif;
    font-size: clamp(56px, 11vw, 132px); letter-spacing: 3px; line-height: 1;
    color: #fff; -webkit-text-stroke: 3px #1b1b26;
    text-shadow: 0 3px 0 #c9d4e3, 0 6px 0 #aab8cc, 0 9px 0 #8b9bb2, 0 12px 0 #6c7d97,
                 0 15px 0 #4e5f7b, 0 18px 0 #33415c, 0 24px 22px rgba(0, 0, 0, .55);
  }
  #center h1 .sq { color: #ffd23f; }
  #center p:empty { display: none; }
  /* lap counter and bonus pop-ups */
  .pop {
    font-family: "Luckiest Guy", "Arial Black", sans-serif;
    position: fixed; left: 0; right: 0; text-align: center; color: #fff; pointer-events: none;
    -webkit-text-stroke: 2px #1b1b26; opacity: 0; transition: opacity .15s, transform .15s;
    text-shadow: 0 3px 0 #6c7d97, 0 6px 0 #33415c, 0 9px 10px rgba(0, 0, 0, .5);
  }
  .pop.show { opacity: 1; transform: scale(1.08); }
  #lap { top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 44px; }
  #bonus { top: 24%; font-size: 52px; color: #ffd23f; }
  #center p  { font-size: 22px; margin: 6px; }
  /* points at the ghost while he's off screen */
  #ghostPtr { position: fixed; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px;
              pointer-events: none; display: none; }
  #ghostPtr .arrow { position: absolute; inset: 0; }
  #ghostPtr .arrow::after {
    content: ''; position: absolute; right: -4px; top: 50%; margin-top: -11px;
    border-left: 18px solid #fff; border-top: 11px solid transparent; border-bottom: 11px solid transparent;
    filter: drop-shadow(0 0 2px #1b1b26) drop-shadow(0 0 1px #1b1b26);
  }
  /* test mode */
  #testBtn {
    position: fixed; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none;
    font: 20px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; color: #fff; cursor: pointer;
    background: #33415c; border: 3px solid #1b1b26; border-radius: 10px; padding: 10px 16px 7px;
    box-shadow: 0 5px 0 #1b1b26; z-index: 5;
  }
  #muteBtn {
    position: fixed; right: 22px; top: calc(70px + env(safe-area-inset-top, 0px)); z-index: 5; cursor: pointer;
    font-size: 22px; line-height: 1; color: #fff; background: #33415c; border: 3px solid #1b1b26; border-radius: 10px;
    padding: 8px 10px; box-shadow: 0 5px 0 #1b1b26;
  }
  #muteBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1b1b26; }
  #muteBtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #testBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1b1b26; }
  #testTag {
    position: fixed; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: none;
    font: 18px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; color: #1b1b26; pointer-events: none;
    background: #ffd23f; border: 3px solid #1b1b26; border-radius: 8px; padding: 6px 12px 3px;
  }
  #testPanel {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10, 14, 24, .55); z-index: 10;
  }
  #testPanel.open { display: flex; }
  #testPanel .card {
    width: min(760px, 94%); max-height: calc(100% - 24px); overflow-y: auto; box-sizing: border-box; padding: 16px 20px 14px;
    background: #222a3d; color: #e9edf5; border: 4px solid #1b1b26; border-radius: 16px; box-shadow: 0 10px 0 #1b1b26;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  #testPanel h2 { font: 30px/1 "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; margin: 0 0 4px; color: #fff; }
  #testPanel h3 { font: 17px/1 "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; margin: 12px 0 6px; color: #ffd23f; }
  #testPanel .note { margin: 0; color: #b9c2d6; font-size: 13px; line-height: 1.35; }
  #testPanel .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  #testPanel .pair { display: flex; gap: 0 28px; flex-wrap: wrap; }
  #testPanel button {
    font: 600 14px "Segoe UI", system-ui, sans-serif; color: #fff; cursor: pointer;
    background: #33415c; border: 2px solid #1b1b26; border-radius: 9px; padding: 6px 10px;
  }
  #testPanel button[aria-pressed="true"] { background: #ffd23f; color: #1b1b26; }
  #testPanel button:focus-visible, #testBtn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #testPanel .actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  #testPanel #testStart { font: 22px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px;
                          background: #3fbf5a; padding: 8px 18px 5px; box-shadow: 0 4px 0 #1b1b26; }
  #testPanel #testExit { margin-left: auto; background: transparent; color: #b9c2d6; }
  /* leaderboard */
  .lbcard {
    box-sizing: border-box; background: #222a3d; color: #e9edf5; border: 4px solid #1b1b26; border-radius: 16px;
    box-shadow: 0 10px 0 #1b1b26; font: 15px/1.35 "Segoe UI", system-ui, sans-serif; text-shadow: none; text-align: left;
  }
  .lbcard h3 { font: 18px/1 "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; margin: 0 0 8px; color: #ffd23f; }
  .lbcard button {
    font: 600 14px "Segoe UI", system-ui, sans-serif; color: #fff; cursor: pointer;
    background: #33415c; border: 2px solid #1b1b26; border-radius: 9px; padding: 6px 10px;
  }
  .lbcard button[aria-pressed="true"] { background: #ffd23f; color: #1b1b26; }
  .lbcard button:focus-visible, .lbcard input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .lbcard ol { list-style: none; margin: 0; padding: 0; }
  .lbcard li { display: flex; align-items: baseline; gap: 8px; padding: 3px 8px; border-radius: 8px; }
  .lbcard li.me { background: #ffd23f; color: #1b1b26; }
  .lbcard li .rk { width: 26px; font: 16px "Luckiest Guy", "Arial Black", sans-serif; color: #ffd23f; }
  .lbcard li.me .rk { color: #1b1b26; }
  .lbcard li .nm { flex: 1; font: 18px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; }
  .lbcard li .sc { font: 18px "Luckiest Guy", "Arial Black", sans-serif; min-width: 2.2em; text-align: right; }
  .lbcard li .sp { font-size: 12px; opacity: .7; text-align: right; white-space: nowrap; }
  #lbMini li .sp { display: none; }
  .lbcard li .del { width: 22px; padding: 0; font-size: 12px; background: transparent; border-color: #5a6680; }
  .lbcard li .del.sure { width: auto; padding: 0 6px; background: #d9443f; border-color: #d9443f; color: #fff; }
  .lbcard li .delGap { width: 22px; flex: none; }
  .lbcard li.hd { padding-top: 0; padding-bottom: 0; }
  .lbcard li.hd span { font: 11px sans-serif; color: #b9c2d6; opacity: 1; }
  #lbMini li.hd { display: none; }
  .lbcard .muted { color: #b9c2d6; font-size: 13px; }
  #lbMini { position: absolute; right: 18px; bottom: 18px; width: 230px; padding: 12px 12px 10px; display: none; z-index: 5; }
  #lbMini .row2 { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
  #board { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 9; pointer-events: none; }
  #board.modal { display: flex; background: rgba(10, 14, 24, .55); pointer-events: auto; }
  #board.side { display: flex; justify-content: flex-end; align-items: flex-start; padding: 126px 3% 12px 0; box-sizing: border-box; }   /* starts below the mute button */
  #boardCard { width: min(380px, 40%); max-height: 100%; box-sizing: border-box; overflow-y: auto; padding: 16px 16px 12px; pointer-events: auto; }
  #board.modal #boardCard { width: min(420px, 92%); max-height: 92%; }
  #boardCard .tabs { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  #boardCard .tabs .x { margin-left: auto; background: transparent; color: #b9c2d6; }
  #lbPlace { font: 20px/1.15 "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; color: #fff; margin: 0 0 10px; }
  #lbPlace .y { color: #ffd23f; }
  #lbName { margin: 0 0 12px; padding: 10px; border-radius: 10px; background: #2c3650; }
  #lbName input {
    width: 6.2em; font: 22px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 2px; text-transform: uppercase;
    background: #1b1b26; color: #ffd23f; border: 2px solid #5a6680; border-radius: 8px; padding: 5px 8px 2px; margin-right: 6px;
  }
  #lbName label { display: inline-flex; flex-direction: column; font-size: 12px; color: #b9c2d6; margin-right: 6px; }
  #lbName input.pin { width: 3.2em; }
  #lbName { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 2px; }
  #lbName h3, #lbName p { flex-basis: 100%; }
  #lbName .go { font: 18px "Luckiest Guy", "Arial Black", sans-serif; letter-spacing: 1px; background: #3fbf5a; padding: 7px 14px 4px; }
  #lbFoot { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #center.withBoard { padding-right: 44%; box-sizing: border-box; }
  #ghostPtr svg { position: absolute; left: 14px; top: 12px; width: 36px; height: 40px;
                  filter: drop-shadow(0 3px 0 #1b1b26); }
</style>
</head>
<body>
<div id="game">
<div id="score" class="hud">0</div>
<div id="best" class="hud"></div>
<div id="coins" class="hud">0</div>
<div id="lap" class="pop"></div>
<div id="bonus" class="pop"></div>
<button id="testBtn" type="button">Test mode</button>
<button id="muteBtn" type="button" aria-label="Sound on or off (M)" title="Sound (M)"></button>
<div id="testTag"></div>
<div id="testPanel" role="dialog" aria-label="Test mode">
  <div class="card">
    <h2>Test mode</h2>
    <p class="note">The obstacle you pick comes first, then about every third obstacle after that, always the difficult version. Nothing else is difficult. Test scores don't count toward your best and never go on the leaderboard.</p>
    <h3>Obstacle</h3>
    <div class="opts" data-group="only">
      <button type="button" data-v="park">Graveyard + ghost</button>
      <button type="button" data-v="rail">Red train</button>
      <button type="button" data-v="road">Conveyor road</button>
      <button type="button" data-v="jam">Gridlock</button>
      <button type="button" data-v="crumble">Boulder field</button>
      <button type="button" data-v="river">Cracked logs</button>
      <button type="button" data-v="sink">Sinking logs</button>
      <button type="button" data-v="roller">Steamroller</button>
      <button type="button" data-v="dark">Darkness</button>
      <button type="button" data-v="">Nothing difficult</button>
    </div>
    <div class="pair"><div>
    <h3>Speed</h3>
    <div class="opts" data-group="speed">
      <button type="button" data-v="0">Grows with distance</button>
      <button type="button" data-v="200">1.3x</button>
      <button type="button" data-v="1000">1.8x (max)</button>
    </div>
    </div><div>
    <h3>Getting hit</h3>
    <div class="opts" data-group="god">
      <button type="button" data-v="0">Game over</button>
      <button type="button" data-v="1">Keep going, show the hit</button>
    </div>
    </div></div>
    <div class="actions">
      <button type="button" id="testStart">Start test</button>
      <button type="button" id="testExit">Exit test mode</button>
    </div>
  </div>
</div>
<div id="lbMini" class="lbcard"></div>
<div id="board"><div id="boardCard" class="lbcard" role="dialog" aria-label="Leaderboard"></div></div>
<div id="ghostPtr"><div class="arrow"></div><svg viewBox="0 0 36 40"><path d="M3 38V17a15 15 0 0 1 30 0v21l-5-4-5 4-5-4-5 4-5-4z" fill="#f4f6ff" stroke="#1b1b26" stroke-width="3" stroke-linejoin="round"/><rect x="10" y="13" width="5" height="8" fill="#1b1b26"/><rect x="21" y="13" width="5" height="8" fill="#1b1b26"/></svg></div>
<div id="center"><h1 id="title" class="logo">CROSSY RD<span class="sq">²</span></h1><p id="sub"></p><p id="sub2"></p></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// =====================================================================
// Crossy Road inside a square tube. Every lane is a ring around all four
// inner faces. Walking off the side of a face carries you onto the next
// face, and the camera rolls 90 degrees so that face becomes the floor
// (Run 3 style), while keeping Crossy's high third-person view.
// =====================================================================

// ---------------- tuning ----------------
const W = 11;                    // tiles per face
const P = W * 4;                 // tiles around the tube
const H = W / 2;                 // half the tube width (tiles are 1 unit)
const HOP_TIME = 0.12;           // seconds per hop
const HOP_HEIGHT = 0.6;
const LAND_TIME = 0.1;
// Crumble zone (a difficult obstacle): 20 rows where the ground is grey and cracked. Each cracked tile
// falls away 2 seconds after you first step on it, whether or not you're still there. Inside the zone
// there are only cracked ground, roads and rails: no trees, rivers, logs, jams or other hard obstacles.
// A boulder drops from the far side of the tube to announce it as you approach.
// Hard crumble zone: boulders fall onto flashing red landing zones near you. Shapes are grid "circles":
// r = 0 is one tile, r = 1 adds every tile next to it in a straight line (a plus), r = 2 grows it once more
// (a diamond of 13). Bigger ones warn for longer. A boulder only kills if you're on a marked tile when it
// lands; it doesn't break the ground. Every landing zone is checked to leave you a way out in time.
const BOULDERS = {
  sizes: [
    { r: 0, warn: 1.0, weight: 0.5,  scale: 0.32 },
    { r: 1, warn: 1.4, weight: 0.35, scale: 0.62 },
    { r: 2, warn: 1.9, weight: 0.15, scale: 0.95 }
  ],
  interval: [0.9, 1.6],   // seconds between drops
  maxActive: 2,
  rowsAhead: [-1, 4],     // where they land relative to you
  tilesAround: 6,
  fallTime: 0.55,         // the boulder is visible for the last part of the warning
  hopTime: 0.18           // assumed time per hop when checking you can escape
};
const ZONE = {
  rows: 20, fromRow: 40, minSpacing: 30,   // the hard variant (falling boulders) comes from the difficulty roll
  fuse: 2.0,          // seconds from stepping on a tile until it falls
  warnAhead: 7,       // the boulder drops when the zone is this many rows ahead of you
  rockFall: 1.1       // seconds for the boulder to fall
};
// Spacing, so there aren't too many different things on screen at once:
//   grassAfter: rows of grass after every hazard block (was 1-2)
//   repeat: chance a road, river or tracks block is followed by the same kind again instead of something new
const SPACING = { grassAfter: [2, 3], repeat: 0.45 };
const AHEAD = 26, BEHIND = 12;   // rows kept around the player
const START_SAFE = 5;            // rows 0..4 have no traffic

// ---------------- difficulty ----------------
// Driven by distance (rows travelled). Up to row 100 it is calm: speeds rise from 0.85x to 1x and no
// difficult obstacles appear. After that one progress value k = 1 - e^(-(row-100)/200) drives both:
//   speed multiplier   1 + 0.8k   (1.31x at 200, 1.51x at 300, 1.69x at 500, max 1.8x)
//   difficult share    0.6k       (24% at 200, 38% at 300, 52% at 500, max 60%)
// Each lane's speed is set from its own row when it is built, so nothing changes speed mid-lane.
const DIFF = { start: 100, scale: 200, calmSpeed: 0.85, maxSpeedUp: 0.8, minHardShare: 0.05, maxHardShare: 0.6 };
// Test mode: `only` is the obstacle family being tested (it comes first, then about every third pick, always
// difficult; nothing else is difficult). speedRow fixes the speed to at least that row's. god: hits don't end
// the run, they show a label instead.
const test = { on: false, only: 'park', speedRow: 0, god: false, first: false, hitT: {} };
const TEST_NAMES = { park: 'Graveyard + ghost', rail: 'Red train', road: 'Conveyor road', jam: 'Gridlock', crumble: 'Boulder field',
                     river: 'Cracked logs', sink: 'Sinking logs', roller: 'Steamroller (1 face, then 2)', dark: 'Darkness (dusk, then dark)', '': 'Nothing difficult' };
const testFam = () => test.only === 'sink' ? 'river' : test.only === 'roller' || test.only === 'dark' ? '' : test.only;   // the obstacle family a test choice belongs to
function progressAt(v) { return v <= DIFF.start ? 0 : 1 - Math.exp(-(v - DIFF.start) / DIFF.scale); }
function speedMul(v) {
  if (test.on && test.speedRow) v = Math.max(v, test.speedRow);
  if (v <= DIFF.start) return DIFF.calmSpeed + (1 - DIFF.calmSpeed) * Math.max(0, v) / DIFF.start;
  return 1 + DIFF.maxSpeedUp * progressAt(v);
}
// the graveyard and its ghost chase: from the graveyard's first row to 40 rows past its end
const inCalm = v => v >= gen.calmFrom && v <= gen.calmTo;
function hardShare(v) {
  if (test.on) return 0;                                  // test mode: only the tested obstacle is difficult
  // 5% from the start; after row 100 it climbs toward 60%
  return DIFF.minHardShare + (DIFF.maxHardShare - DIFF.minHardShare) * progressAt(v);
}

// Obstacle families. Each pick chooses a family by weight, then rolls hardShare to decide whether it is
// the normal or the difficult variant, so the total amount of obstacles stays the same.
const FAMILY = { road: 34, river: 20, rail: 14, park: 8, jam: 8, crumble: 5 };
const PARK = { rows: [6, 12], coins: [4, 8], treeChance: 0.05 };
const BONUS = { lap: 20, lapRows: 10, log: 1, dark: 8,  /* lapRows: rows to climb on EACH face */ jam: 5, crumble: 5, rail: 4, grave: 8, ghost: 5, belt: 3, roller: 5 };   // lap bonus, rows a lap must climb, and difficult-obstacle bonuses
const MIN_V = -2;                // how far back you can walk
const LOG_TOP = 0.14;            // standing height on a log
// Logs: each river row has its own speed, clearly different from the river row before it.
// LOG.lenience: a hop that would just miss a log's end (by up to this much) lands on that end instead.
const LOG = { speed: [0.8, 2.6], minDiff: 0.5, lenience: 0.2 };
// River sections run 1 to 12 rows; each extra row is less likely (decay per row).
const RIVER = { maxRows: 12, decay: 0.72 };
// Cracked logs (the difficult river variant): each log rolls the difficult share. A cracked log usually has
// one crack; each extra crack is rarer. Every log keeps at least one safe spot. Land on a crack: you fall in.
const CRACK = { extraChance: 0.15, gash: 0x24140a, splinter: 0xe8c08a };
// Sinking logs (the other difficult log): half of difficult logs are cracked, half sink. A sinking log has holes
// in it. Land on it and it starts going down: 1.5 s later it's under and anyone still on it sinks with it.
// It stays under for 2.5 s, then floats back up. (Tested: with good timing, 98% of next hops line up within
// 1.5 s, and you can always hop back a row.)
const SINK = { time: 1.5, under: 2.5, rise: 0.6, hole: 0x1c120a, rim: 0x6e4527 };
// Lily pads: about 1 in 4 river rows is a row of stationary pads (never two pad rows in a row),
// with at least 2 pads on every face. Miss a pad and you're in the water.
const LILY = { chance: 0.25, density: 0.28, perFace: 2 };
// Red train (the difficult rail variant): each rail row rolls the difficult share. Its lights flash much
// faster for a shorter warning, then a red train nearly as long as the ring goes round 3 times, covering
// almost the whole row for 2.5 s (fixed, not scaled by difficulty).
// Conveyor road (the difficult road variant): each road lane rolls the difficult share on its own. A conveyor
// lane drags you sideways, against its traffic, at 1.5 tiles/s x the speed multiplier while you stand on it, so
// waiting carries you toward the oncoming cars. Riding it doesn't count as standing still for the hand.
// Never inside crumble zones or jams. +3 for each conveyor lane you cross.
const BELT = { speed: 1.5, base: 0x2f3139, rail: 0x9ba2ae, bolt: 0x5c626d, back: [47, 49, 57], chevron: [246, 184, 46] };
// Steamroller: rolls down the tube toward you over a stretch of at least 12 rows of grass and road (crumble
// zones and boulder fields included; tracks and any river end a stretch). When it reaches water it rolls a
// little way in and sinks, and it never breaks logs or lily pads, so a river is always still crossable. It starts
// on land at the far end and covers the face you're on: two rollers 4 tiles wide with a gap at each edge and
// in the middle, and the rubble it kicks up kills you in the gaps too, so the whole face is deadly as it
// passes. Get onto another face. Difficult version: your face and one next to it (+5 when it passes you).
// It moves at 2 rows/s x the speed multiplier, crushes cars, trees, headstones, skeletons and boulders in its
// way. Crumbling ground in its faces breaks away and falls, leaving holes.
// Rivers of 1 or 2 rows it drives straight across. At a river of 3 or more rows it rolls in and sinks over
// 1.2 s. Either way it takes the logs and lily pads in its faces with it (never the last ones on a row, so the
// river can still be crossed). At tracks it just stops and sinks away.
// 20% chance on each new row you reach while there's a long enough stretch ahead, at least 25 rows apart,

// ---------------- small helpers ----------------
const wrapP = p => ((p % P) + P) % P;
const ringDist = (a, b) => { const d = wrapP(a - b); return Math.min(d, P - d); };
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const rand = (a, b) => a + Math.random() * (b - a);

// Position on the tube wall. pf is a tile coordinate around the tube (tile
// centers at whole numbers, may be fractional and does not need wrapping),
// h is the height above the surface. Near corners the "up" direction blends
// between the two faces so anything moving round a corner turns smoothly.
function ringFrame(pf, h) {
  const s = pf + 0.5;
  const k = Math.floor(s / W);
  const d = s - k * W;
  let b = 0;
  if (d < 0.5) b = d - 0.5; else if (d > W - 0.5) b = d - (W - 0.5);
  const roll = (k + b) * Math.PI / 2;
  const a = k * Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
  const lx = d - H;
  const sx = lx * ca + H * sa, sy = lx * sa - H * ca;   // Rz(a) * (lx, -H)
  return { x: sx - Math.sin(roll) * h, y: sy + Math.cos(roll) * h, roll, face: ((k % 4) + 4) % 4 };
}
// face-local (lx across, h up) -> world, for a given roll
function toWorld(roll, lx, h) {
  const c = Math.cos(roll), s = Math.sin(roll), y = -H + h;
  return [lx * c - y * s, lx * s + y * c];
}

// ---------------- gravity timetable ----------------
function heightFactor(pf) {
  const y = ringFrame(pf, 0).y;                       // -H on the floor, +H on the ceiling
  return GRAVITY.floor + (GRAVITY.ceiling - GRAVITY.floor) * (y + H) / (2 * H);
}
const TT_STEP = 0.05;
const TT_N = Math.round(P / TT_STEP);
// table[dir][i] = time (at unit speed) to travel i*TT_STEP tiles from p = 0 in that direction
const TIMETABLE = { 1: new Float64Array(TT_N + 1), '-1': new Float64Array(TT_N + 1) };
for (const d of [1, -1]) {
  const t = TIMETABLE[d];
  for (let i = 1; i <= TT_N; i++) t[i] = t[i - 1] + TT_STEP / heightFactor(d * (i - 0.5) * TT_STEP);
}
const LAP_TIME = TIMETABLE[1][TT_N];                  // same both ways
const MIN_FACTOR = Math.min(GRAVITY.floor, GRAVITY.ceiling);
// unit-speed time u (any value) -> position around the tube for a car travelling in dir
function ringPosAt(u, dir) {
  const t = TIMETABLE[dir];
  const uu = ((u % LAP_TIME) + LAP_TIME) % LAP_TIME;
  let lo = 0, hi = TT_N;
  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (t[mid] <= uu) lo = mid; else hi = mid; }
  const q = (lo + (uu - t[lo]) / (t[hi] - t[lo])) * TT_STEP;
  return wrapP(dir * q);
}

// ---------------- geometry merging ----------------
// Every lane's static scenery is merged into one mesh, so the whole tube is a
// few hundred draw calls instead of thousands.
const UNIT = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
const UP = UNIT.attributes.position.array, UN = UNIT.attributes.normal.array;
const VCOL = new THREE.MeshLambertMaterial({ vertexColors: true });
const _c = new THREE.Color();

class Merge {
  constructor() { this.p = []; this.n = []; this.c = []; }
  // box in face-local coordinates (x across, y up from the surface, z along), turned onto face rotZ
  box(color, x, y, z, sx, sy, sz, rotZ = 0) {
    _c.setHex(color);
    const cs = Math.cos(rotZ), sn = Math.sin(rotZ);
    const yb = y - H;   // surface of the floor face is at y = -H
    for (let i = 0; i < UP.length; i += 3) {
      const lx = UP[i] * sx + x, ly = UP[i + 1] * sy + yb, lz = UP[i + 2] * sz + z;
      this.p.push(lx * cs - ly * sn, lx * sn + ly * cs, lz);
      const nx = UN[i], ny = UN[i + 1];
      this.n.push(nx * cs - ny * sn, nx * sn + ny * cs, UN[i + 2]);
      this.c.push(_c.r, _c.g, _c.b);
    }
  }
  // box for a moveable object, built standing on y = 0 with no face rotation
  part(color, x, y, z, sx, sy, sz) { this.box(color, x, y + H, z, sx, sy, sz, 0); }
  geometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    return g;
  }
  mesh() { return new THREE.Mesh(this.geometry(), VCOL); }
}

// ---------------- lanes ----------------
const lanes = new Map();
const gen = { type: 'grass', left: 0, lastRiverDir: 1, queue: [], lastJam: false, zone: null, lastZoneEnd: -999,

// A jam pattern: direction, speed and gap centres, shared by the jam and (for difficult jams) its escort lanes.
function makeJamPattern(tier, v) {
  const cfg = JAM[tier];
  const base = Math.random() * P, spacing = P / cfg.gaps;
  const gaps = [];
  for (let i = 0; i < cfg.gaps; i++) gaps.push(wrapP(base + i * spacing + rand(-1.5, 1.5)));
  gaps.sort((x, y) => x - y);
  return { tier, gaps, width: cfg.gapWidth, dir: Math.random() < 0.5 ? 1 : -1,
           speed: rand(2.2, 4.0) * speedMul(v) * cfg.speed };
}

// Car centres for a jam (at clock 0): bumper to bumper between the gaps, the end cars exactly at each gap edge.
function jamCenters(pat) {
  const len = 1.5, half = pat.width / 2, k = pat.gaps.length, out = [];
  for (let i = 0; i < k; i++) {
    const start = pat.gaps[i] + half;
    const end = pat.gaps[(i + 1) % k] + (i + 1 === k ? P : 0) - half;
    const L = end - start;
    const n = Math.max(1, Math.floor((L + JAM.bumper) / (len + JAM.bumper)));
    const step = n > 1 ? (L - len) / (n - 1) : 0;
    for (let j = 0; j < n; j++) out.push(start + len / 2 + j * step);
  }
  return out;
}

// Escort cars that move with the jam, leaving a padded corridor at each gap. Always crossable.
function alignedEscorts(pat) {
  const half = pat.width / 2, pad = JAM.corridorPad, k = pat.gaps.length, out = [];
  for (let i = 0; i < k; i++) {
    const start = pat.gaps[i] + half + pad;
    const end = pat.gaps[(i + 1) % k] + (i + 1 === k ? P : 0) - half - pad;
    const n = Math.round(JAM.difficult.escortCars / k), step = (end - start) / n;
    for (let j = 0; j < n; j++) out.push(start + (j + 0.5) * step);
  }
  return out;
}

// Six escort cars spread round the ring at random, at least 3 tiles apart.
function randomEscorts() {
  const n = JAM.difficult.escortCars, minGap = 3;
  const w = Array.from({ length: n }, () => Math.random());
  const sum = w.reduce((a, b) => a + b, 0), spare = P - n * minGap;
  let pos = Math.random() * P;
  return w.map(x => { const c = pos; pos += minGap + spare * x / sum; return c; });
}

// The jam and both escort lanes move at the same speed, so the three rows repeat exactly once per lap.
// Simulate one lap: a player hops escort -> jam -> escort at a human pace (0.2 s per hop). For each jam gap,
// find the longest stretch of time when no tile at that gap can be crossed. Returns that worst stretch.
function worstBlocked(pat, escortDir, carsA, carsB, limit = Infinity, cache = {}) {
  const v = pat.speed, T = P / v, N = Math.max(40, Math.round(T / 0.05)), dt = T / N;
  const rows = [{ c: carsA, d: escortDir }, { c: jamCenters(pat), d: pat.dir }, { c: carsB, d: escortDir }];
  const reach = 0.75 + 0.3;    // a car blocks a tile when its centre is closer than this
  const S = 2 * N;             // two laps, so time windows never need to wrap
  const build = row => {
    const b = new Uint8Array(S * P);
    for (let s = 0; s < S; s++) {
      for (const c0 of row.c) {
        const c = wrapP(c0 + row.d * v * s * dt);
        for (let x = Math.round(c) - 2; x <= Math.round(c) + 2; x++) {
          const xx = wrapP(x);
          if (ringDist(c, xx) < reach) b[s * P + xx] = 1;
        }
      }
    }
    // prefix sums over time for each tile
    const pre = new Uint16Array((S + 1) * P);
    for (let s = 0; s < S; s++) for (let x = 0; x < P; x++) pre[(s + 1) * P + x] = pre[s * P + x] + b[s * P + x];
    return pre;
  };
  // the jam row is the same on every try, so it is built once and reused
  if (!cache.jam) cache.jam = build(rows[1]);
  const blocked = [build(rows[0]), cache.jam, build(rows[2])];
  const clearOver = (r, x, s0, s1) => rows[r] && (blocked[r][(s1 + 1) * P + x] - blocked[r][s0 * P + x]) === 0;
  // seconds each row is occupied, from the moment you start: mid-hop in, to mid-hop out, plus a margin
  const occ = [[0.0, 0.33], [0.2, 0.53], [0.4, 0.73]].map(([a, b]) => [Math.floor(a / dt), Math.ceil(b / dt)]);
  const feasible = (s, x) => occ.every(([a, b], r) => clearOver(r, x, s + a, s + b));
  let worst = 0;
  for (const g0 of pat.gaps) {
    let run = 0, longest = 0, first = -1;
    for (let s = 0; s < N; s++) {
      const centre = g0 + pat.dir * v * (s * dt + 0.2);    // where the gap is as you enter it
      let ok = false;
      for (let x = Math.floor(centre) - 1; x <= Math.ceil(centre) + 1 && !ok; x++) {
        if (ringDist(x, centre) <= 1 && feasible(s, wrapP(x))) ok = true;
      }
      if (ok) { if (first < 0) first = run; run = 0; } else { run++; longest = Math.max(longest, run); }
      if (longest * dt > limit) return Infinity;           // already failed: stop early
    }
    if (first < 0) return Infinity;                        // never crossable
    longest = Math.max(longest, run + first);              // a blocked stretch can wrap round the lap
    worst = Math.max(worst, longest * dt);
  }
  return worst;
}

function planEscorts(pat) {
  const cfg = JAM.difficult;
  if (cfg.escortOpposite) {
    let best = null;
    const cache = {};
    for (let i = 0; i < cfg.planTries; i++) {
      const cars = [randomEscorts(), randomEscorts()];
      const worst = worstBlocked(pat, -pat.dir, cars[0], cars[1], cfg.maxBlocked, cache);
      if (!best || worst < best.worst) best = { cars, worst };
      if (worst <= cfg.maxBlocked) break;
    }
    if (best.worst <= cfg.maxBlocked) return { dir: -pat.dir, cars: best.cars, worst: best.worst, fallback: false };
  }
  const al = alignedEscorts(pat);
  return { dir: pat.dir, cars: [al, al], worst: 0, fallback: true };
}

// One row of a crumble zone: starts and ends on cracked ground, with road and rail blocks in between.
function zoneSpec(v) {
  const z = gen.zone;
  z.left--;
  const first = z.left === ZONE.rows - 1, last = z.left === 0;
  let kind;
  if (first || last) kind = 'ground';
  else if (z.blockLeft > 0) { z.blockLeft--; kind = z.block; }
  else if (z.block !== 'ground') { z.block = 'ground'; z.blockLeft = randInt(0, 1); kind = 'ground'; }
  else if (Math.random() < 0.7) { z.block = 'road'; z.blockLeft = randInt(0, 2); kind = 'road'; }
  else if (!(GRAVE.calm.noRails && inCalm(v))) { z.block = 'rail'; z.blockLeft = 0; kind = 'rail'; }
  else { z.block = 'road'; z.blockLeft = 0; kind = 'road'; }
  if (last) { gen.zone = null; gen.lastZoneEnd = v; gen.type = 'zone'; gen.left = 0; }
  return { type: kind === 'ground' ? 'grass' : kind, cracked: kind === 'ground', inZone: true, zoneFirst: first, zoneTier: z.tier };
}

// Can you get from the first row of a graveyard to its last, going round gravestones?
function graveyardPassable(stones) {
  const n = stones.length, seen = new Set(), queue = [];
  for (let p = 0; p < P; p++) if (!stones[0].has(p)) { seen.add(p); queue.push([0, p]); }
  while (queue.length) {
    const [r, p] = queue.shift();
    if (r === n - 1) return true;
    for (const [dr, dp] of [[1, 0], [0, 1], [0, -1], [-1, 0]]) {
      const nr = r + dr, np = wrapP(p + dp);
      if (nr < 0 || nr >= n || stones[nr].has(np) || seen.has(nr * P + np)) continue;
      seen.add(nr * P + np); queue.push([nr, np]);
    }
  }
  return false;
}
function graveyardSpec(v) {
  const n = GRAVE.rows;
  const roll = () => Array.from({ length: n }, () => {
    const st = new Set();
    for (let p = 0; p < P; p++) if (Math.random() < GRAVE.stoneChance) st.add(p);
    return st;
  });
  let stones = roll();
  for (let i = 0; i < 40 && !graveyardPassable(stones); i++) stones = roll();
  if (!graveyardPassable(stones)) { const c = randInt(0, P - 1); stones.forEach(st => st.delete(c)); }
  const rows = stones.map(st => ({ type: 'grass', grave: true, stones: st, coinTiles: [], skeletons: [] }));
  const taken = new Set();
  const openTile = (r, lo, hi) => {
    for (let i = 0; i < 30; i++) {
      const p = randInt(lo, hi);
      if (!rows[r].stones.has(p) && !taken.has(r * P + p)) { taken.add(r * P + p); return p; }
    }
    return -1;
  };
  // one skeleton per 2 rows on every face
  for (let r0 = 0; r0 < n; r0 += GRAVE.skel.perRows) {
    for (let f = 0; f < 4; f++) {
      const r = Math.min(n - 1, r0 + randInt(0, GRAVE.skel.perRows - 1));
      const p = openTile(r, f * W, f * W + W - 1);
      if (p >= 0) rows[r].skeletons.push(p);
    }
  }
  const coins = randInt(GRAVE.coins[0], GRAVE.coins[1]);
  for (let i = 0; i < coins; i++) {
    const r = randInt(0, n - 1), p = openTile(r, 0, P - 1);
    if (p >= 0) rows[r].coinTiles.push(p);
  }
  gen.queue.push(...rows.slice(1));
  gen.type = 'grass'; gen.left = 0; gen.lastPark = true;
  gen.calmFrom = v; gen.calmTo = v + n + GRAVE.ghost.chaseRows;
  graveyards.push({ start: v, exit: v + n, woke: false });
  bonuses.push({ row: v + n, points: BONUS.grave, label: 'GRAVEYARD' });
  return rows[0];
}

function nextSpec(v) {
  if (v < START_SAFE) return { type: 'grass' };
  if (gen.zone) return zoneSpec(v);
  if (gen.queue.length) return gen.queue.shift();
  if (gen.left > 0) { gen.left--; return { type: gen.type, hard: gen.blockHard }; }
  if (gen.type !== 'grass') {               // a strip of grass after every hazard block
    gen.type = 'grass'; gen.left = randInt(SPACING.grassAfter[0], SPACING.grassAfter[1]) - 1; gen.blockHard = false; return { type: 'grass' };
  }
  const prog = progressAt(v);
  const jamAllowed = !gen.lastJam;
  gen.lastJam = false;
  let hard = Math.random() < hardShare(v);
  // families that can't appear here are left out of this pick
  const parkAllowed = !gen.lastPark;
  gen.lastPark = false;
  const weights = Object.entries(FAMILY).filter(([f]) =>
    !(f === 'park' && !parkAllowed) &&
    !(f === 'rail' && GRAVE.calm.noRails && inCalm(v)) &&
    !(f === 'jam' && (!jamAllowed || v < JAM.normal.fromRow)) &&
    !(f === 'crumble' && (v < ZONE.fromRow || v - gen.lastZoneEnd < ZONE.minSpacing)));
  if (test.on && test.only === 'roller') {
    // testing steamrollers: long stretches of land, so one can come along every few rows
    const keep = weights.filter(([f]) => f !== 'rail');
    weights.length = 0; weights.push(...(keep.length ? keep : [['road', 1]]));
    test.first = false;
  } else if (test.on && test.only === 'dark') {
    test.first = false;                                   // darkness sits on top of ordinary rows
  } else if (test.on && test.only) {
    // the tested family comes first, then about a third of the time, ignoring its usual row limits
    const tf = testFam();
    const others = weights.filter(([f]) => f !== tf);
    const total = others.reduce((t, [, w]) => t + w, 0);
    const blocked = (tf === 'park' && !parkAllowed) || (tf === 'jam' && !jamAllowed);
    weights.length = 0;
    if (!test.first) weights.push(...others);
    if (!blocked) weights.push([tf, test.first ? 1 : total / 2]);
    if (!weights.length) weights.push(['road', 1]);
    test.first = false;
  }
  let roll = Math.random() * weights.reduce((t, [, w]) => t + w, 0), fam = weights[0][0];
  for (const [f, w] of weights) { if ((roll -= w) <= 0) { fam = f; break; } }
  // stick with the same kind of block for a bit, so fewer different things are mixed together
  if (!test.on && ['road', 'river', 'rail'].includes(gen.lastFam) && weights.some(([f]) => f === gen.lastFam) &&
      Math.random() < SPACING.repeat) fam = gen.lastFam;
  gen.lastFam = fam;
  if (test.on) hard = fam === testFam();
  // during a ghost chase: never a second graveyard, and gridlocks only if allowed
  if (inCalm(v) && (fam === 'park' || (fam === 'jam' && GRAVE.calm.noGridlock))) hard = false;
  gen.blockHard = hard;

  if (fam === 'crumble') {
    gen.zone = { left: ZONE.rows, block: 'ground', blockLeft: 0, tier: hard ? 'difficult' : 'normal' };
    return zoneSpec(v);
  }
  if (fam === 'jam') {
    gen.lastJam = true;
    gen.type = 'jam'; gen.left = 0;          // anything but grass, so a grass strip follows
    const tier = hard ? 'difficult' : 'normal';
    const pattern = makeJamPattern(tier, v + 1);
    if (tier === 'normal') {
      gen.queue.push({ type: 'road', jam: pattern }, { type: 'grass', sparse: true });
    } else {
      pattern.escorts = planEscorts(pattern);
      gen.queue.push({ type: 'road', escort: pattern, side: 0 }, { type: 'road', jam: pattern },
                     { type: 'road', escort: pattern, side: 1 }, { type: 'grass', sparse: true });
    }
    return { type: 'grass', clear: true };   // the row you line up on: nothing in the way
  }
  if (fam === 'park' && hard) return graveyardSpec(v);
  if (fam === 'park') {
    // a long stretch of open grass with a few coins
    const n = randInt(PARK.rows[0], PARK.rows[1]);
    const rows = Array.from({ length: n }, () => ({ type: 'grass', park: true, coinTiles: [] }));
    const coins = randInt(PARK.coins[0], PARK.coins[1]);
    for (let i = 0; i < coins; i++) rows[randInt(0, n - 1)].coinTiles.push(randInt(0, P - 1));
    gen.queue.push(...rows.slice(1));
    gen.type = 'grass'; gen.left = 0; gen.lastPark = true;   // never two parks in a row
    return rows[0];
  }
  if (fam === 'road')       { gen.type = 'road';  gen.left = randInt(0, 2 + Math.round(prog * 2)); }
  else if (fam === 'river') {
    let n = 1;                                             // 1..12 rows, longer ones rarer
    while (n < RIVER.maxRows && Math.random() < RIVER.decay) n++;
    gen.type = 'river'; gen.left = n - 1;
  }
  else                      { gen.type = 'rail';  gen.left = randInt(0, 1); }
  return { type: gen.type, hard };
}

function makeLane(v) {
  const spec = nextSpec(v);
  const type = spec.type;
  const prev = lanes.get(v - 1);
  const mul = speedMul(v);
  const lane = {
    v, type, blocked: new Set(), holes: new Set(), coins: new Map(),
    trees: new Map(), vehicles: [], logs: [], dir: 1, speed: 0,
    group: new THREE.Group(), staticMesh: null,
    cracked: !!spec.cracked, inZone: !!spec.inZone,
    fuse: new Map(),        // cracked tile -> clock time it falls
    fuseMeshes: new Map(),  // cracked tile -> its warning overlay
    park: !!spec.park, grave: !!spec.grave
  };
  lane.zoneTier = spec.zoneTier || null;
  if (spec.zoneFirst) zones.push({ start: v, end: v + ZONE.rows - 1, tier: spec.zoneTier,
                                  triggered: false, t: 0, roll: 0, done: false, nextDrop: 0 });
  if (spec.zoneFirst && spec.zoneTier === 'difficult')
    bonuses.push({ row: v + ZONE.rows, points: BONUS.crumble, label: 'BOULDER FIELD' });
  if (spec.jam && spec.jam.tier === 'difficult')
    bonuses.push({ row: v + 2, points: BONUS.jam, label: 'GRIDLOCK' });   // past the far escort lane
  lane.group.position.z = -v;
  if (spec.grave) lane.skels = spec.skeletons.map(p => ({ pos: p, state: 'idle', t: 0, dir: 1, from: p, to: p, dur: 1 }));

  if (type === 'grass') {
    const deco = v < MIN_V;                  // rows behind where you can walk: thick trees
    for (let p = 0; p < P; p++) {
      const face = Math.floor(p / W), u = p % W;
      const nearStart = v <= START_SAFE && face === 0 && Math.abs(u - Math.floor(W / 2)) <= 2;
      if (nearStart && !deco) continue;
      if (spec.grave && !deco) {
        if (spec.stones.has(p)) { lane.blocked.add(p); lane.trees.set(p, -1 - randInt(0, 2)); }   // -1..-3: gravestones
        else if (spec.coinTiles.includes(p)) lane.coins.set(p, null);
        continue;
      }
      let chance = deco ? 0.7 : (v < START_SAFE ? 0.1 : 0.17);
      if ((spec.clear || spec.cracked) && !deco) chance = 0;
      if (spec.park && !deco) chance = spec.coinTiles.includes(p) ? 0 : PARK.treeChance;
      if (spec.sparse && !deco) chance = lane.blocked.has(wrapP(p - 1)) || (p === P - 1 && lane.blocked.has(0)) ? 0 : 0.08;
      if (Math.random() < chance) {
        lane.blocked.add(p);

    for (let i = 0; i < n; i++) {

    }
    for (let p = 0; p < P; p++) if (Math.random() < 0.02) lane.coins.set(p, null);

    if (prev && prev.type === 'river') {

      const cracks = new Set();

        // difficult log: cracked or sinking, half and half (test mode picks the one being tested)
        sink = test.on ? test.only === 'sink' : Math.random() < 0.5;

    if (lane.hard) {

      lane.trainLen = P - RED_TRAIN.gap;
      lane.laps = RED_TRAIN.laps;

      lane.trainSpeed = (lane.laps * P - lane.trainLen) / RED_TRAIN.coverSeconds;
      bonuses.push({ row: v + 1, points: BONUS.rail, label: 'RED LINE' });

      lane.trainLen = 9;
      lane.laps = 1;
      lane.trainSpeed = 26 * mul;

    lane.pass = (lane.laps * P + lane.trainLen + 2) / lane.trainSpeed;
    lane.period = lane.idle + lane.warn + lane.pass;
    lane.phase = Math.random() * lane.period;
    lane.cycle = -1;
    lane.trainStart = 0;
  }

  buildLaneStatic(lane);
  buildLaneDynamic(lane);
  scene.add(lane.group);
  lanes.set(v, lane);
  scheduleDark(v);

}

        if (st.warn && ding % 2 === 0 && ding !== lane.dingAt) { lane.dingAt = ding; SFX.bell(vol); }
        if (st.run && !lane.wasRunning) SFX.horn(vol, lane.hard);
      }
      lane.wasRunning = st.run;
      lane.lampMat.color.setHex((st.warn || st.run) && on ? 0xff2a1f : 0x4a1210);
      lane.alertMat.opacity = st.warn ? (on ? (lane.hard ? 0.5 : 0.38) : 0.12) : 0;
      const yaw = lane.dir > 0 ? 0 : Math.PI;
      lane.wagons.forEach((mesh, i) => {
        const pos = wagonPos(lane, st, i);
        mesh.visible = pos !== null;
        if (mesh.visible) place(mesh, pos, 0, yaw);
      });
    }
    for (const coin of lane.coins.values()) if (coin) coin.rotation.y = clock * 3;
  }
}

const player = {

  yaw: 0, yawTarget: 0, landT: 0, onLog: null, slot: null, idleT: 0
};

let clock = 0;

const particles = [];

const pops = { lap: 0, bonus: 0 };

function addBonus(points, label) {
  game.bonus += points;
  run.b[points] = (run.b[points] || 0) + 1;            // the leaderboard checks bonuses against these counts
  game.score = game.dist + game.bonus;
  document.getElementById('bonus').textContent = label + '  +' + points;
  document.getElementById('bonus').dataset.hit = '';
  pops.bonus = 1.6;
  SFX.bonus(label === 'FULL LAP');
}

// Lap bonus (spiral rule): go round all 4 faces in one direction, climbing at least BONUS.lapRows rows on
// each face before you step onto the next one. Each face you leave with enough rows climbed on it counts
// toward the 4; leaving a face too early, or turning back, starts the lap again. A flat circle earns nothing.
function trackLap() {
  const f = Math.floor((player.pf + 0.5) / W);
  if (f === lap.face) return;
  const d = Math.sign(f - lap.face);
  const climbed = player.v - lap.entryRow;            // rows climbed on the face you're leaving
  lap.face = f;
  lap.entryRow = player.v;
  let msg;
  if (climbed < BONUS.lapRows) {
    // only worth a message if this broke a lap you'd started; casual face changes stay quiet
    const broke = lap.steps > 0;
    lap.steps = 0; lap.dir = 0;
    if (!broke) return;
    msg = 'LAP: ' + BONUS.lapRows + ' ROWS ON EACH FACE';
  } else if (lap.dir !== 0 && d !== lap.dir) {
    lap.dir = d; lap.steps = 1;                         // turned back: this face starts a new lap
    msg = '1/4';
  } else {
    lap.dir = d; lap.steps++;
    msg = lap.steps + '/4';
  }
  if (lap.steps >= 4) {
    lap.steps = 0; lap.dir = 0;
    addBonus(BONUS.lap, 'FULL LAP');
    msg = '4/4';
  } else SFX.lapTick();
  document.getElementById('lap').textContent = msg;
  pops.lap = 1.4;
}

function laneAt(v) { return lanes.get(v) || makeLane(v); }
function surfaceHeight(lane) { return lane && lane.type === 'river' ? LOG_TOP : 0; }

function yawFor(dp, dv) {
  if (dv > 0) return 0;
  if (dv < 0) return Math.PI;
  return dp > 0 ? -Math.PI / 2 : Math.PI / 2;
}

function onBelt() { const l = lanes.get(player.v); return !!l && !!l.belt && !player.hop; }
function calmHand() {
  player.idleT = 0;
  if (handState.phase === 'coming') { handState.phase = 'leaving'; handState.t = 0; SFX.handStop(); }
}

function updateHand(dt) {
  // riding a log while you wait for the right moment doesn't count as standing still
  if (game.mode === 'play' && game.started && !player.hop && !player.onLog && !onBelt()) player.idleT += dt;
  if (handState.phase === 'idle' && game.mode === 'play' && player.idleT >= HAND.idle / speedMul(game.dist)) {
    handState.phase = 'coming';
    handState.t = 0;
    handState.dur = HAND.approach / speedMul(Math.max(0, player.v));   // faster as the game speeds up
    SFX.handComing(handState.dur);
  }
  if (handState.phase === 'coming') {
    handState.t += dt;
    if (handState.t >= handState.dur && game.mode === 'play') { handState.phase = 'struck'; handState.t = 0; die('slap');
      if (game.mode === 'play') { handState.phase = 'leaving'; handState.t = 0; player.idleT = 0; } }
  } else if (handState.phase === 'leaving') {
    handState.t += dt;
    if (handState.t > 0.45) handState.phase = 'idle';
  } else if (handState.phase === 'struck') {
    handState.t += dt;
  }
}

function tryMove(dp, dv) {
  if (game.mode === 'ready') startGame();
  if (game.mode !== 'play') return;
  if (player.hop) { player.queued = [dp, dv]; return; }
  player.yawTarget = yawFor(dp, dv);
  const here = lanes.get(player.v);
  if (player.onLog && dv === 0 && here && here.type === 'river') {
    // sideways on a log: exactly one spot along it, whichever way it's moving (off the end is water)
    player.hop = { fp: player.pf, fv: player.v, tp: player.pf + dp, tv: player.v, t: 0, dp, dv,
                   along: { lane: here, log: player.onLog, from: player.slot, slot: player.slot + dp } };
    calmHand();
    player.onLog = null;
    game.started = true;
    SFX.hop();
    return;
  }
  const tp = Math.round(player.pf) + dp;
  const tv = player.v + dv;
  if (tv < MIN_V) { player.bump = 0.14; SFX.bump(); return; }
  const lane = laneAt(tv);
  const tw = wrapP(tp);
  if (lane.blocked.has(tw) || lane.holes.has(tw)) { player.bump = 0.14; SFX.bump(); return; }
  player.hop = { fp: player.pf, fv: player.v, tp, tv, t: 0, dp, dv };
  if (dv > 0) run.hops++;
  calmHand();
  player.onLog = null;
  game.started = true;
  SFX.hop();
}

function finishHop() {
  const h = player.hop;
  player.hop = null;
  player.v = h.tv;
  player.pf = hopEnds(h)[1];
  player.landT = LAND_TIME;
  const lane = laneAt(player.v);
  if (lane.type === 'pads' && !lane.pads.has(wrapP(Math.round(player.pf)))) { die('water'); return; }
  if (lane.type === 'river' && h.along) {
    if (h.along.slot < 0 || h.along.slot >= h.along.log.len) { die('water'); return; }
    if (isSunk(h.along.log)) { die('water'); return; }
    if (h.along.log.cracks.has(h.along.slot)) { die('crack'); return; }
    player.onLog = h.along.log;
    SFX.log();
    payLog(h.along.log);
    startSinking(h.along.log);
    player.slot = h.along.slot;
  } else if (lane.type === 'river') {
    let log = logUnder(lane, player.pf);
    if (!log) {
      const end = logEndNear(lane, player.pf);      // just missed a log's end: land on it
      if (!end) { die('water'); return; }
      log = end.log;
    }
    // snap onto the nearest slot of the log, like Crossy
    const a = logStart(lane, log);
    let slot = Math.round(wrapP(player.pf - a));
    if (slot > P / 2) slot -= P;
    slot = Math.max(0, Math.min(log.len - 1, slot));
    let target = a + slot;
    let diffP = wrapP(target - player.pf);
    if (diffP > P / 2) diffP -= P;
    player.pf += diffP;
    if (log.cracks.has(slot)) { die('crack'); return; }   // landed on a crack: it gives way
    player.onLog = log;
    SFX.log();
    payLog(log);
    startSinking(log);
    player.slot = slot;
  }
  const tile = wrapP(Math.round(player.pf));
  if (lane.cracked) {
    if (lane.holes.has(tile)) { die('crumble'); return; }       // it fell while you were in the air
    if (!lane.fuse.has(tile)) lightFuse(lane, tile);
  }
  const coin = lane.coins.get(tile);
  if (coin) { lane.group.remove(coin); lane.coins.delete(tile); game.coins++; SFX.coin(); }
  if (player.v > game.dist) game.dist = player.v;
  for (const b of bonuses) {
    if (!b.done && player.v >= b.row) { b.done = true; addBonus(b.points, b.label); }
  }
  game.score = game.dist + game.bonus;
}

const HIT_NAMES = { car: 'CAR', train: 'TRAIN', water: 'WATER', crumble: 'FELL', boulder: 'BOULDER', crack: 'CRACKED LOG',
                    grab: 'GRABBED', slap: 'SLAPPED', skeleton: 'SKELETON', ghost: 'GHOST', sink: 'SANK', roller: 'STEAMROLLER' };
function testHit(cause) {
  if (test.hitT[cause] && clock - test.hitT[cause] < 0.7) return;
  test.hitT[cause] = clock;
  SFX.death(cause);
  const el = document.getElementById('bonus');
  el.textContent = 'HIT: ' + (HIT_NAMES[cause] || cause);
  el.dataset.hit = '1';
  pops.bonus = 1.0;
  camState.shake = Math.max(camState.shake, 0.12);
}
function die(cause) {
  if (game.mode !== 'play') return;
  if (test.on && test.god) { testHit(cause); return; }
  SFX.handStop();
  SFX.death(cause);
  game.mode = 'dying';
  game.death = cause;
  game.deathT = 0;
  player.hop = null;
  player.queued = null;
  if (!test.on && run.ranked && game.score > game.best) { game.best = game.score; lbStore('best', game.best); }
  const f = ringFrame(player.pf, 0);
  game.deathRoll = f.roll;
  if (cause === 'water' || cause === 'crack' || cause === 'sink') splash(player.pf, player.v);
}

const zones = [];            // crumble zones generated so far, for the boulder announcement
const fallingPieces = [];    // tiles that have given way, on their way down
const FUSE_GEO = new THREE.BoxGeometry(0.98, 0.014, 0.98);
const FALL_GEO = new THREE.BoxGeometry(0.98, 0.4, 0.98);
const BOULDER_GEO = (() => {
  const m = new Merge(), c = COLORS.boulder;
  m.part(c[0], 0, 1.5, 0, 3.4, 2.7, 3.0);
  m.part(c[1], 0.5, 3.0, -0.3, 2.4, 1.0, 2.2);
  m.part(c[2], -1.2, 1.0, 0.8, 1.5, 1.5, 1.5);
  m.part(c[1], 1.4, 0.9, 1.0, 1.3, 1.2, 1.2);
  m.part(c[2], 0.2, 0.6, -1.4, 1.6, 1.0, 1.0);
  return m.geometry();
})();

function lightFuse(lane, tile) {
  lane.fuse.set(tile, clock + ZONE.fuse);
  SFX.fuse();
  const mesh = new THREE.Mesh(FUSE_GEO, new THREE.MeshBasicMaterial({ color: 0x1a0d08, transparent: true, opacity: 0.1, depthWrite: false }));
  mesh.rotation.order = 'ZYX';
  const f = ringFrame(tile, 0.012);
  mesh.position.set(f.x, f.y, 0);
  mesh.rotation.set(0, 0, f.roll);
  mesh.userData.home = [f.x, f.y];
  lane.group.add(mesh);
  lane.fuseMeshes.set(tile, mesh);
}

function collapse(lane, tile) {
  lane.fuse.delete(tile);
  const warn = lane.fuseMeshes.get(tile);
  if (warn) { lane.group.remove(warn); warn.material.dispose(); lane.fuseMeshes.delete(tile); }
  lane.holes.add(tile);
  buildLaneStatic(lane);
  const mesh = new THREE.Mesh(FALL_GEO, new THREE.MeshLambertMaterial({ color: COLORS.cracked[0] }));
  mesh.rotation.order = 'ZYX';
  scene.add(mesh);
  fallingPieces.push({ mesh, tile, v: lane.v, t: 0, spin: rand(-2, 2) });
  if (Math.abs(lane.v - player.v) <= 6) SFX.crumble();
  // standing on it (not mid-hop) means you go down with it
  if (game.mode === 'play' && !player.hop && player.v === lane.v && wrapP(Math.round(player.pf)) === tile) die('crumble');
}

function updateCrumble(dt) {
  for (const lane of lanes.values()) {
    if (!lane.fuse.size) continue;
    for (const [tile, at] of [...lane.fuse]) {
      if (clock >= at) { collapse(lane, tile); continue; }
      const mesh = lane.fuseMeshes.get(tile);
      const k = 1 - (at - clock) / ZONE.fuse;              // 0 when stepped on, 1 when it falls
      mesh.material.opacity = 0.12 + 0.55 * k;
      const shake = k > 0.65 ? (k - 0.65) * 0.12 : 0;
      mesh.position.x = mesh.userData.home[0] + Math.sin(clock * 70 + tile) * shake;
      mesh.position.y = mesh.userData.home[1] + Math.cos(clock * 63 + tile) * shake;
    }
  }
  for (let i = fallingPieces.length - 1; i >= 0; i--) {
    const f = fallingPieces[i];
    f.t += dt;
    const fr = ringFrame(f.tile, -0.2 - 4.5 * f.t * f.t);
    f.mesh.position.set(fr.x, fr.y, -f.v);
    f.mesh.rotation.set(f.t * f.spin, 0, fr.roll);
    if (f.t > 1.4) { scene.remove(f.mesh); f.mesh.material.dispose(); fallingPieces.splice(i, 1); }
  }
}

// The boulder: drops from the side opposite you onto the first row of the zone as you approach it.
function updateZones(dt) {
  for (const z of zones) {
    if (z.done) continue;
    if (!z.triggered) {
      if (game.mode !== 'play' || player.v < z.start - ZONE.warnAhead) continue;
      z.triggered = true;
      SFX.whistle(ZONE.rockFall);
      z.roll = Math.floor((player.pf + 0.5) / W) * Math.PI / 2;   // onto the face you're looking at
      z.mesh = new THREE.Mesh(BOULDER_GEO, VCOL);
      z.mesh.rotation.order = 'ZYX';
      scene.add(z.mesh);
      // a shadow on the landing spot grows as the boulder comes down
      z.shadow = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.02, 24),
        new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false }));
      z.shadow.rotation.order = 'ZYX';
      const [sx, sy] = toWorld(z.roll, 0, 0.03);
      z.shadow.position.set(sx, sy, -z.start);
      z.shadow.rotation.set(0, 0, z.roll);
      scene.add(z.shadow);
    }
    z.t += dt;
    const k = clamp01(z.t / ZONE.rockFall);
    const h = lerp(W - 2.5, 0, k * k);                    // falls from near the far wall, speeding up
    z.shadow.material.opacity = 0.15 + 0.4 * k;
    z.shadow.scale.setScalar(0.4 + 0.8 * k);
    const [x, y] = toWorld(z.roll, 0, h);
    z.mesh.position.set(x, y, -z.start);
    z.mesh.rotation.set(z.t * 0.6, z.t * 0.9, z.roll);
    if (k >= 1) {
      z.done = true;
      scene.remove(z.mesh);
      scene.remove(z.shadow);
      z.shadow.geometry.dispose(); z.shadow.material.dispose();
      rubble(z.roll, z.start);
      camState.shake = 0.55;
      SFX.boom(2);
    }
  }
}

const drops = [];            // boulders with a landing zone, active in hard crumble zones
// landing-zone tile: red fill with a white border, so it stays distinct from a flashing rail lane
const MARK_GEO = (() => {
  const m = new Merge();
  m.part(0xff2a1f, 0, 0, 0, 0.8, 0.02, 0.8);
  for (const [x, z, sx, sz] of [[0, -0.44, 0.96, 0.08], [0, 0.44, 0.96, 0.08], [-0.44, 0, 0.08, 0.8], [0.44, 0, 0.08, 0.8]])
    m.part(0xffffff, x, 0.005, z, sx, 0.025, sz);
  return m.geometry();
})();
const key = (v, p) => v + ':' + wrapP(p);

function walkable(v, p) {
  const lane = lanes.get(v);
  return !!lane && !lane.blocked.has(wrapP(p)) && !lane.holes.has(wrapP(p)) && v >= MIN_V;
}
// Can you get from your tile to a tile outside every landing zone within `steps` hops?
function canEscape(danger, steps) {
  const sv = player.v, sp = Math.round(player.pf);
  if (!danger.has(key(sv, sp))) return true;
  const seen = new Set([key(sv, sp)]);
  let frontier = [[sv, sp]];
  for (let d = 0; d < steps; d++) {
    const next = [];
    for (const [v, p] of frontier) {
      for (const [dv, dp] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nv = v + dv, np = p + dp, k = key(nv, np);
        if (seen.has(k) || !walkable(nv, np)) continue;
        if (!danger.has(k)) return true;
        seen.add(k);
        next.push([nv, np]);
      }
    }
    frontier = next;
  }
  return false;
}

function pickSize() {
  let r = Math.random();
  for (const s of BOULDERS.sizes) { if ((r -= s.weight) <= 0) return s; }
  return BOULDERS.sizes[0];
}

function trySpawnDrop(z) {
  const size = pickSize();
  for (let attempt = 0; attempt < 8; attempt++) {
    const row = Math.max(z.start, Math.min(z.end, player.v + randInt(BOULDERS.rowsAhead[0], BOULDERS.rowsAhead[1])));
    const p = Math.round(player.pf) + randInt(-BOULDERS.tilesAround, BOULDERS.tilesAround);
    const tiles = [];
    for (let dv = -size.r; dv <= size.r; dv++) {
      for (let dp = -(size.r - Math.abs(dv)); dp <= size.r - Math.abs(dv); dp++) {
        const tv = row + dv;
        if (tv < z.start || tv > z.end) continue;             // only inside the zone
        tiles.push([tv, p + dp]);
      }
    }
    // never box you in: with this drop and every other active one, you must be able to step clear in time
    const danger = new Set(tiles.map(([v, q]) => key(v, q)));
    for (const d of drops) for (const k of d.keys) danger.add(k);
    const steps = Math.floor((size.warn - 0.45) / BOULDERS.hopTime);
    if (!canEscape(danger, steps)) continue;
    const mat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.3, depthWrite: false, fog: false });
    const markers = tiles.map(([v, q]) => {
      const m = new THREE.Mesh(MARK_GEO, mat);
      m.rotation.order = 'ZYX';
      const f = ringFrame(q, 0.02);
      m.position.set(f.x, f.y, -v);
      m.rotation.set(0, 0, f.roll);
      scene.add(m);
      return m;
    });
    const mesh = new THREE.Mesh(BOULDER_GEO, VCOL);
    mesh.rotation.order = 'ZYX';
    mesh.scale.setScalar(size.scale);
    mesh.visible = false;
    scene.add(mesh);
    drops.push({ size, row, p, t: 0, mat, markers, mesh, keys: new Set(tiles.map(([v, q]) => key(v, q))), spin: rand(-2, 2) });
    return true;
  }
  return false;
}

function clearDrop(d) {
  for (const m of d.markers) scene.remove(m);
  d.mat.dispose();
  scene.remove(d.mesh);
}

function updateDrops(dt) {
  // spawn while you're inside a hard zone
  if (game.mode === 'play') {
    for (const z of zones) {
      if (z.tier !== 'difficult' || player.v < z.start || player.v > z.end) continue;
      z.nextDrop -= dt;
      if (z.nextDrop <= 0 && drops.length < BOULDERS.maxActive) {
        trySpawnDrop(z);
        z.nextDrop = rand(BOULDERS.interval[0], BOULDERS.interval[1]);
      }
    }
  }
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t += dt;
    const left = d.size.warn - d.t;
    // flash faster as it gets closer
    const rate = 3 + 9 * clamp01(d.t / d.size.warn);
    d.mat.opacity = Math.sin(clock * rate * Math.PI * 2) > 0 ? 0.85 : 0.35;
    if (left <= BOULDERS.fallTime) {
      const k = clamp01(1 - left / BOULDERS.fallTime);
      const f = ringFrame(d.p, lerp(W - 3, 0, k * k));
      if (!d.mesh.visible) SFX.whistle(left);
      d.mesh.visible = true;
      d.mesh.position.set(f.x, f.y, -d.row);
      d.mesh.rotation.set(d.t * d.spin, d.t * 1.3, f.roll);
    }
    if (left <= 0) {
      // impact: anyone on a marked tile is crushed
      if (game.mode === 'play') {
        let pv = player.v, pp = player.pf;
        if (player.hop) {
          const t = clamp01(player.hop.t);
          pv = t < 0.5 ? player.hop.fv : player.hop.tv;
          const [hf, ht] = hopEnds(player.hop);
          pp = lerp(hf, ht, t);
        }
        if (d.keys.has(key(pv, Math.round(pp)))) die('boulder');
      }
      const f = ringFrame(d.p, 0);
      rubble(f.roll, d.row, ringLocalX(d.p), 0.3 + d.size.r * 0.35);
      camState.shake = Math.max(camState.shake, 0.15 + d.size.r * 0.12);
      SFX.boom(d.size.r);
      clearDrop(d);
      drops.splice(i, 1);
    }
  }
}

function rubble(roll, v, lx = 0, amount = 1) {
  const ux = -Math.sin(roll), uy = Math.cos(roll), tx = Math.cos(roll), ty = Math.sin(roll);
  const n = Math.round(34 * amount);
  for (let i = 0; i < n; i++) {
    const size = i < n * 0.4 ? rand(0.45, 0.8) * Math.min(1, amount + 0.3) : rand(0.18, 0.35);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size),
      new THREE.MeshLambertMaterial({ color: pick(COLORS.boulder) }));
    const [x, y] = toWorld(roll, lx + rand(-1.4, 1.4) * Math.min(1, amount + 0.2), 0.8);
    mesh.position.set(x, y, -v + rand(-1, 1));
    scene.add(mesh);
    const side = rand(-1, 1) * 5, up = rand(3, 7);
    particles.push({ mesh, life: rand(0.8, 1.3), ux, uy,
      vel: [ux * up + tx * side, uy * up + ty * side, rand(-2.5, 2.5)] });
  }
}

function splash(pf, v) {
  const f = ringFrame(pf, 0);
  const ux = -Math.sin(f.roll), uy = Math.cos(f.roll);
  for (let i = 0; i < 12; i++) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    const side = rand(-1, 1);
    mesh.position.set(f.x, f.y, -v);
    scene.add(mesh);
    particles.push({
      mesh, life: rand(0.5, 0.8), ux, uy,
      vel: [ux * rand(2, 4) + uy * side * 1.5, uy * rand(2, 4) - ux * side * 1.5, rand(-1.2, 1.2)]
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life -= dt;
    q.vel[0] -= q.ux * 12 * dt; q.vel[1] -= q.uy * 12 * dt;
    q.mesh.position.x += q.vel[0] * dt; q.mesh.position.y += q.vel[1] * dt; q.mesh.position.z += q.vel[2] * dt;
    if (q.life <= 0) { scene.remove(q.mesh); q.mesh.geometry.dispose(); q.mesh.material.dispose(); particles.splice(i, 1); }
  }
}

function update(dt) {
  clock += dt;
  if (game.mode === 'play' && game.started) run.secs += dt;
  if (game.mode === 'play') {
    if (player.bump > 0) player.bump = Math.max(0, player.bump - dt);
    if (player.landT > 0) player.landT = Math.max(0, player.landT - dt);

    if (player.hop) {
      const h = player.hop;
      h.t += dt / HOP_TIME;
      // traffic can catch you mid-hop: check the lane you are over right now
      const t = clamp01(h.t);
      const lv = t < 0.5 ? h.fv : h.tv;
      const [hf, ht] = hopEnds(h);
      const lp = lerp(hf, ht, t);
      const lane = lanes.get(lv);
      if (lane && lane.type === 'road' && vehicleHits(lane, lp)) die('car');
      else if (lane && lane.type === 'rail' && trainHits(lane, lp)) die('train');
      else if (lane && lane.skels && skelHits(lane, lp)) die('skeleton');
      else if (rollerHits(lp, lerp(h.fv, h.tv, t))) die('roller');
      else if (h.t >= 1) finishHop();
    } else {
      const lane = laneAt(player.v);
      if (lane.type === 'river') {
        if (!player.onLog || !lane.logs.includes(player.onLog)) {
          player.onLog = logUnder(lane, player.pf);
          if (player.onLog) player.slot = Math.max(0, Math.min(player.onLog.len - 1,
            Math.round(wrapP(player.pf - logStart(lane, player.onLog) + P / 2) - P / 2)));
        }
        if (!player.onLog) die('water');
        else if (isSunk(player.onLog)) die('sink');               // stayed on a sinking log too long
        else player.pf += lane.dir * lane.speed * dt;     // the log carries you, even round a corner
      }
      if (lane.belt) player.pf += lane.beltDir * lane.beltSpeed * dt;   // the conveyor drags you
      if (lane.type === 'road' && vehicleHits(lane, player.pf)) die('car');
      if (lane.type === 'rail' && trainHits(lane, player.pf)) die('train');
      if (lane.skels && skelHits(lane, player.pf)) die('skeleton');
      if (rollerHits(player.pf, player.v)) die('roller');
      if (game.mode === 'play' && player.queued) {
        const q = player.queued; player.queued = null; tryMove(q[0], q[1]);
      }
    }

    if (game.mode === 'play' && !player.hop) trackLap();
    carHonks();
    updateHand(dt);

    // Crossy-style camera: follows you forward, never back, and creeps once you've started
    if (game.started) camState.want += CAM.creep * speedMul(game.dist) * dt;   // creeps faster the further you go
    const pv = player.hop ? lerp(player.hop.fv, player.hop.tv, clamp01(player.hop.t)) : player.v;
    camState.want = Math.max(camState.want, pv);
    if (game.mode === 'play' && game.started && player.v < camState.want - CAM.eagleGap) {
      handState.phase = 'idle';           // a slap on its way is replaced by the grab
      die('grab');
      camState.want = player.v + 1;       // swing the camera back so you see the hand take you
    }
  } else if (game.mode === 'dying') {
    if (handState.phase === 'struck') handState.t += dt;
    game.deathT += dt;
    if (game.deathT > 1.5) gameOver();
  }
  camState.v += (camState.want - camState.v) * smooth(dt, CAM.followTime);
  ensureLanes();
  updateLanes(dt);
  updateSkeletons(dt);
  updateGhost(dt);
  updateRollers(dt);
  updateParticles(dt);
  updateCrumble(dt);
  updateZones(dt);
  updateDrops(dt);
}

// ---------------- drawing the player and camera ----------------
function updateVisuals(dt) {
  let pf = player.pf, vz = player.v, h = 0;
  let sx = 1, sy = 1, sz = 1;
  const laneNow = lanes.get(player.v);
  let base = player.onLog ? LOG_TOP - Math.min(0.3, logDepth(player.onLog)) : 0;

  if (player.hop) {
    const t = clamp01(player.hop.t);
    const e = t * t * (3 - 2 * t);
    const [hf, ht] = hopEnds(player.hop);
    pf = lerp(hf, ht, e);
    vz = lerp(player.hop.fv, player.hop.tv, e);
    const fromBase = lanes.get(player.hop.fv) && lanes.get(player.hop.fv).type === 'river' ? LOG_TOP : 0;
    const toBase = lanes.get(player.hop.tv) && lanes.get(player.hop.tv).type === 'river' ? LOG_TOP : 0;
    base = lerp(fromBase, toBase, t);
    h = Math.sin(Math.PI * t) * HOP_HEIGHT;
    const takeoff = clamp01(1 - t / 0.3), air = Math.sin(Math.PI * t);
    sy = 1 - 0.22 * takeoff + 0.12 * air;
    sx = sz = 1 + 0.12 * takeoff - 0.06 * air;
  }
  if (player.landT > 0) {
    const k = Math.sin((player.landT / LAND_TIME) * Math.PI);
    sy = 1 - 0.25 * k; sx = sz = 1 + 0.15 * k;
  }
  if (player.bump > 0) h = Math.sin((player.bump / 0.14) * Math.PI) * 0.18;

  // turn quickly toward the way you're moving
  let dy = player.yawTarget - player.yaw;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  player.yaw += dy * smooth(dt, 0.035);

  let yaw = player.yaw, extraRoll = 0;
  let z = -vz;
  const fr = ringFrame(pf, base + h);
  let px = fr.x, py = fr.y, roll = fr.roll;
  let show = true;

  let handGrab = null;
  if (game.mode === 'dying' || game.mode === 'over') {
    const t = game.deathT, r = game.deathRoll;
    if (game.death === 'grab') {
      // the hand reaches in from behind the camera, closes on you, and pulls you back off the screen
      const lx = ringLocalX(player.pf);
      const reach = clamp01(t / 0.4);
      const pull = Math.max(0, t - 0.45);
      const hz = lerp(-player.v + 9, -player.v, reach) + pull * 16;
      const hh = lerp(5, 1.3, reach) + pull * 5;
      const [hx, hy] = toWorld(r, lx, hh);
      handGrab = { x: hx, y: hy, z: hz, roll: r };
      if (t > 0.45) {
        const [cx, cy] = toWorld(r, lx, hh - 0.95);
        px = cx; py = cy; z = hz;
      }
    } else if (game.death === 'ghost') {
      // lifted up and spun away
      const f2 = ringFrame(player.pf, t * 1.8);
      px = f2.x; py = f2.y;
      yaw += t * 9;
      show = t < 0.9;
    } else if (game.death === 'car' || game.death === 'boulder' || game.death === 'slap' || game.death === 'skeleton' || game.death === 'roller') {
      sy = 0.14; sx = 1.35; sz = 1.35;
      const f2 = ringFrame(player.pf, 0.04);
      px = f2.x; py = f2.y;
    } else if (game.death === 'train') {
      const lane = lanes.get(player.v);
      const dir = lane ? lane.dir : 1;
      const f2 = ringFrame(player.pf + dir * t * 9, 0.4 + t * 3 - t * t * 2);
      px = f2.x; py = f2.y; roll = f2.roll;
      extraRoll = t * 14;
    } else if (game.death === 'water' || game.death === 'crack' || game.death === 'sink') {
      const f2 = ringFrame(player.pf, -t * 1.2);
      px = f2.x; py = f2.y;
      show = t < 0.8;
    } else if (game.death === 'crumble') {
      const drop = -0.5 * 9 * t * t;
      const f2 = ringFrame(player.pf, drop);
      px = f2.x; py = f2.y;
    }
  }

  spyMesh.visible = show;
  spyMesh.position.set(px, py, z);
  spyMesh.rotation.set(extraRoll, yaw, roll);
  spyMesh.scale.set(sx, sy, sz);

  const gb = ringFrame(pf, base + 0.015);
  blob.visible = show && game.mode !== 'dying';
  blob.position.set(gb.x, gb.y, -vz);
  blob.rotation.set(0, 0, gb.roll);
  blob.scale.setScalar(Math.max(0.5, 1 - h * 0.8));

  // highlight the tile you're on; it reddens as the tile is about to give way
  const standing = !player.hop && game.mode === 'play';
  marker.visible = standing;
  if (standing) {
    const tile = Math.round(player.pf);
    const mf = ringFrame(player.onLog || onBelt() ? player.pf : tile, base + 0.01);
    marker.position.set(mf.x, mf.y, -player.v);
    marker.rotation.set(0, 0, mf.roll);
    const at = laneNow && laneNow.fuse.get(wrapP(tile));
    const st = player.onLog ? sinkPhase(player.onLog) : null;
    const k = at ? clamp01(1 - (at - clock) / ZONE.fuse) : st !== null ? clamp01(st / SINK.time) : 0;
    marker.material.color.setRGB(1, lerp(0.95, 0.2, k), lerp(0.48, 0.15, k));
    marker.material.opacity = 0.45 + 0.35 * k;
    if (k > 0.6) marker.position.x += Math.sin(clock * 60) * 0.03;
  }
  // the hand comes straight down at you from above, along the face you're on
  hand.visible = !!handGrab || (handState.phase !== 'idle' && (game.mode !== 'over' || game.death === 'slap'));
  if (handGrab) {
    hand.position.set(handGrab.x, handGrab.y, handGrab.z);
    hand.rotation.set(0.6, Math.PI, handGrab.roll);        // fingers toward you, reaching forward
    hand.scale.setScalar(game.deathT > 0.45 ? 0.85 : 1);
  } else if (hand.visible) {
    let h;
    if (handState.phase === 'coming') { const k = clamp01(handState.t / handState.dur); h = lerp(HAND.startHeight, 1.15, k * k); }
    else if (handState.phase === 'leaving') h = lerp(1.15 + (HAND.startHeight - 1.15) * 0.4, HAND.startHeight + 2, clamp01(handState.t / 0.45));
    else h = 0.75;
    const hf = ringFrame(player.pf, base + h);
    hand.position.set(hf.x, hf.y, -player.v);
    // slap: open palm flat; grab: tilted, fingers curling under
    hand.rotation.set(0, 0, hf.roll);
    hand.scale.setScalar(1);
  }

  updateCamera(dt);
  updateDarkness(dt);
  drawGhost();
}

const _gv = new THREE.Vector3();
const _ghostGlow = new THREE.Color(0xdfe6ff);
function drawGhost() {
  const ptr = document.getElementById('ghostPtr');
  ghostMesh.visible = ghost.active;
  if (!ghost.active) { ptr.style.display = 'none'; return; }
  const bob = Math.sin(clock * 3.2) * 0.12;
  const f = ringFrame(ghost.gpf, GRAVE.ghost.height + bob + (ghost.leaving ? (1 - ghost.fade) * 3 : 0));
  ghostMesh.position.set(f.x, f.y, -ghost.gv);
  ghostMesh.rotation.set(0, Math.sin(clock * 1.7) * 0.25, f.roll + Math.sin(clock * 2.3) * 0.08);
  ghostMat.opacity = 0.82 * ghost.fade;
  ghostMat.emissive.setHex(0x7a84b8).lerp(_ghostGlow, darkLook.amt);   // he glows in the dark
  ghostFaceMat.opacity = ghost.fade;
  // off screen: an arrow on the screen edge points to him
  _gv.set(f.x, f.y, -ghost.gv).project(camera);
  let x = _gv.x, y = _gv.y;
  const behind = _gv.z > 1;
  if (behind) { x = -x; y = -y; if (Math.abs(x) < 1e-3 && Math.abs(y) < 1e-3) y = -1; }
  const onScreen = !behind && Math.abs(x) < 0.98 && Math.abs(y) < 0.98;
  if (onScreen || ghost.leaving || game.mode === 'over') { ptr.style.display = 'none'; return; }
  const k = 1 / Math.max(Math.abs(x) / 0.86, Math.abs(y) / 0.8);
  const sx = (x * k + 1) / 2 * view.w, sy = (1 - y * k) / 2 * view.h;
  const ang = Math.atan2(-y, x);
  const near = clamp01(1 - (ghostDist().d - 2) / 6);
  ptr.style.display = 'block';
  ptr.style.left = sx + 'px'; ptr.style.top = sy + 'px';
  ptr.style.transform = 'scale(' + (1 + 0.25 * near * (0.5 + 0.5 * Math.sin(clock * 12))) + ')';
  ptr.firstChild.style.transform = 'rotate(' + ang + 'rad)';
}

function ringLocalX(pf) {
  const s = pf + 0.5, k = Math.floor(s / W);
  return s - k * W - H;
}

function updateCamera(dt) {
  // Run 3 roll: the face you're on is always the floor. Snaps by whole faces, eased.
  const focus = player.hop ? hopEnds(player.hop)[1] : player.pf;
  const face = Math.floor((focus + 0.5) / W);
  const rollTarget = (game.mode === 'dying' || game.mode === 'over')
    ? camState.roll : face * Math.PI / 2;
  camState.roll += (rollTarget - camState.roll) * smooth(dt, CAM.rollTime);

  // lean a little toward a sideways hop so you can see where you're going
  const leanTarget = player.hop ? player.hop.dp * 0.7 : 0;
  camState.lean += (leanTarget - camState.lean) * smooth(dt, 0.12);

  const r = camState.roll, c = Math.cos(r), s = Math.sin(r);
  const rot = (x, y) => [x * c - y * s, x * s + y * c];
  const [cx, cy] = rot(camState.lean, -H + CAM.height);
  const [tx, ty] = rot(camState.lean, -H);
  camera.position.set(cx, cy, -camState.v + CAM.back);
  if (camState.shake > 0) {
    camState.shake = Math.max(0, camState.shake - dt);
    const a = camState.shake * 0.7;
    camera.position.x += (Math.random() - 0.5) * a;
    camera.position.y += (Math.random() - 0.5) * a;
  }
  camera.up.set(-s, c, 0);
  camera.lookAt(tx, ty, -camState.v - CAM.lookAhead);

  // the sun turns with the camera, so whichever face is the floor is lit like Crossy's ground
  const [lx, ly] = rot(3, 10);
  sun.position.set(lx, ly, camera.position.z + 4);
  sun.target.position.set(0, 0, camera.position.z - 4);
}

  gen.calmFrom = -1; gen.calmTo = -2;

function weekKey(t = Date.now()) {

  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

const nameOk = n => typeof n === 'string' && /^[A-Z0-9]{1,6}$/.test(n);
const isInt = x => Number.isInteger(x) && x >= 0;
// does this run obey the game's rules?
function runOk(r) {
  if (!r || typeof r !== 'object') return false;
  const { dist, bonus, secs, hops, b } = r;
  if (!isInt(dist) || !isInt(bonus) || !isInt(hops) || !Number.isFinite(secs) || dist < 1 || dist > 1e6) return false;
  if (hops < dist || secs < hops / LBV.hopsPerSec) return false;     // every row needs a forward hop, and hops take time
  if (!b || typeof b !== 'object' || Array.isArray(b)) return false;

  if ((b[20] || 0) > Math.floor(hops / (BONUS.lapRows * 4))) return false;   // a lap climbs 10 rows on all 4 faces

  const wk = weekKey();

  const sc = d => tab === 'week' ? d.wBest : d.best, at = d => (tab === 'week' ? d.wAt : d.at) || 0;

// ---- talking to Firebase ----
// The online version keeps scores in Firebase (Firestore), loaded only when the config above is filled in, and
// after the game has started, so the game never waits for it. Each computer signs in anonymously (no account).
// A name belongs to whoever claims it first, protected by a 4-digit PIN: names/<NAME> = { owner, pin hash } is
// unreadable to players, and the database rules only let the owner write scores/<NAME>. Entering the right PIN
// on another computer moves the name there. Rules: firestore.rules (they are the real protection, not this code).
function lbScript(src) {
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
}
async function lbInit() {
  const W8 = typeof window !== 'undefined' ? window : null;
  if (!FIREBASE_CONFIG || !W8 || typeof document === 'undefined' || !document.head) { LB.state = 'off'; return lbRender(); }
  try {
    if (!W8.firebase) {
      const u = 'https://www.gstatic.com/firebasejs/' + FB_VERSION + '/firebase-';
      await lbScript(u + 'app-compat.js');
      await Promise.all([lbScript(u + 'auth-compat.js'), lbScript(u + 'firestore-compat.js')]);
    }
    const fb = W8.firebase;
    const app = fb.apps && fb.apps.length ? fb.app() : fb.initializeApp(FIREBASE_CONFIG);
    const auth = app.auth();
    let u = auth.currentUser || await new Promise(r => { const off = auth.onAuthStateChanged(x => { off(); r(x); }); });
    if (!u) u = (await auth.signInAnonymously()).user;
    LB.uid = u.uid;
    LB.db = app.firestore();
  } catch (e) { LB.state = 'off'; LB.err = ''; return lbRender(); }
  LB.state = 'ok';
  lbSubscribe();
  const n = lbLoad('name');
  if (nameOk(n)) { LB.name = n; await lbLoadMine(); }
  if (LB.pending) lbPost(LB.pending);
  lbShow(LB.view);
}
async function lbLoadMine() {

    const s = await LB.db.doc('scores/' + LB.name).get();
    if (s.exists) {
      LB.mine = s.data();
      if (rowOk(LB.mine)) { game.best = Math.max(game.best, LB.mine.best); lbStore('best', game.best); }
    }
  } catch (e) {}
}
function lbSubscribe() {

  const col = LB.db.collection('scores');
  const take = key => snap => { LB[key] = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })); lbRender(); };
  const fail = () => { LB.err = 'Leaderboard is offline right now.'; lbRender(); };
  LB.unsub.push(col.orderBy('best', 'desc').limit(LBV.fetch).onSnapshot(take('all'), fail));
  // equality only, sorted here: needs no extra database index
  LB.unsub.push(col.where('week', '==', LB.wk).limit(LBV.fetchWeek).onSnapshot(take('week'), fail));

function lbWrite(doc, run) {
  const name = doc.name, ref = LB.db.doc('scores/' + name);
  const attempt = () => ref.set(doc);
